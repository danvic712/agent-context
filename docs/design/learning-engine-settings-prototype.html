<!doctype html>
<!--
  PROTOTYPE — Learning Engine operations integrated into Settings.
  Question: should the /health operations page and the top health marker become
  one coherent Settings surface focused on runtime operations?
  Four variants, switchable with ?variant=a|b|c|d.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Context — Learning Engine × Settings prototype</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap');

    :root {
      --paper: #eef2f6;
      --card: #fbfdff;
      --card2: #e2e9f0;
      --ink: #33414d;
      --muted: #5b6b7a;
      --dim: #97a6b5;
      --accent: #2f6fc8;
      --accent-soft: rgba(47, 111, 200, .10);
      --accent-ink: #1e4d8f;
      --accent-shadow: rgba(47, 111, 200, .28);
      --hi: #d98e4a;
      --hi-soft: rgba(217, 142, 74, .14);
      --ok: #4f9d8f;
      --ok-soft: rgba(79, 157, 143, .12);
      --warn: #c08a2e;
      --warn-soft: rgba(192, 138, 46, .13);
      --red: #c96f5a;
      --red-soft: rgba(201, 111, 90, .13);
      --line: rgba(51, 65, 77, .10);
      --line2: rgba(51, 65, 77, .19);
      --shadow: 0 1px 3px rgba(51, 65, 77, .04), 0 16px 40px rgba(51, 65, 77, .10);
      --topbg: rgba(251, 253, 255, .86);
    }

    [data-theme="dark"] {
      --paper: #15202b;
      --card: #1c2733;
      --card2: #24323f;
      --ink: #e6edf4;
      --muted: #93a4b5;
      --dim: #5d6e80;
      --accent: #84c3ec;
      --accent-soft: rgba(132, 195, 236, .12);
      --accent-ink: #b3dbf6;
      --accent-shadow: rgba(132, 195, 236, .28);
      --hi: #e0a05e;
      --hi-soft: rgba(224, 160, 94, .15);
      --ok: #55c4a3;
      --ok-soft: rgba(85, 196, 163, .13);
      --warn: #d9b45c;
      --warn-soft: rgba(217, 180, 92, .14);
      --red: #e0806e;
      --red-soft: rgba(224, 128, 110, .15);
      --line: rgba(230, 237, 244, .11);
      --line2: rgba(230, 237, 244, .20);
      --shadow: 0 1px 3px rgba(0, 0, 0, .28), 0 18px 44px rgba(0, 0, 0, .36);
      --topbg: rgba(28, 39, 51, .90);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: #0e151b;
      font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }

    .prototype-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 20px;
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 14px;
      color: #d8e0e7;
    }
    .prototype-meta h1 {
      margin: 0;
      font: 600 17px/1.1 Newsreader, Georgia, serif;
      letter-spacing: -.015em;
    }
    .prototype-meta p {
      margin: 0;
      color: #8fa0ad;
      font: 10px/1.4 'JetBrains Mono', monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .frame {
      width: min(1180px, calc(100% - 32px));
      min-height: 820px;
      margin: 0 auto 104px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 18px;
      box-shadow: 0 34px 90px rgba(0, 0, 0, .45);
    }
    .app {
      min-height: 820px;
      background: var(--paper);
      color: var(--ink);
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 58px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--topbg);
      backdrop-filter: blur(12px);
    }
    .brand {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font: 600 17px/1 Newsreader, Georgia, serif;
    }
    .brand-mark {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line));
      border-radius: 11px 15px 11px 15px;
      color: white;
      background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 65%, var(--hi)));
      box-shadow: 0 4px 12px var(--accent-shadow);
      transform: rotate(-4deg);
    }
    .brand small {
      display: block;
      margin-top: 3px;
      color: var(--dim);
      font: 7px/1 'JetBrains Mono', monospace;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 0;
      overflow: auto;
    }
    .nav span {
      padding: 7px 11px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .nav span.active {
      color: var(--accent-ink);
      background: var(--accent-soft);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
    .engine-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 10px;
      border: 1px solid color-mix(in srgb, var(--ok) 36%, var(--line));
      border-radius: 999px;
      color: var(--ok);
      background: var(--ok-soft);
      font: 10px/1.1 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .engine-pill.attention {
      border-color: color-mix(in srgb, var(--warn) 48%, var(--line));
      color: var(--warn);
      background: var(--warn-soft);
    }
    .dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 15%, transparent);
    }
    .theme-button {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid var(--line2);
      border-radius: 50%;
      color: var(--muted);
      background: var(--card);
    }
    .theme-button:hover, .engine-pill:hover { color: var(--ink); border-color: var(--accent); }

    .page {
      width: min(1080px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0 54px;
    }
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 0 24px;
    }
    .kicker {
      margin-bottom: 9px;
      color: var(--hi);
      font: 10px/1 'JetBrains Mono', monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h2, h3, h4, p { margin: 0; }
    .hero h2 {
      max-width: 620px;
      font: 600 clamp(34px, 5vw, 50px)/.96 Newsreader, Georgia, serif;
      letter-spacing: -.045em;
    }
    .hero-copy p {
      max-width: 650px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }
    .hero-aside {
      display: grid;
      justify-items: end;
      gap: 8px;
      flex: 0 0 auto;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--card);
      font-size: 10px;
      white-space: nowrap;
    }
    .badge.accent { border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); color: var(--accent-ink); background: var(--accent-soft); }
    .badge.ok { border-color: color-mix(in srgb, var(--ok) 38%, var(--line)); color: var(--ok); background: var(--ok-soft); }
    .badge.warn { border-color: color-mix(in srgb, var(--warn) 42%, var(--line)); color: var(--warn); background: var(--warn-soft); }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .section-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0 10px;
    }
    .section-label h3 { font: 600 21px/1.05 Newsreader, Georgia, serif; letter-spacing: -.02em; }
    .section-label p { color: var(--dim); font-size: 11px; }
    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: color-mix(in srgb, var(--card) 95%, transparent);
      box-shadow: var(--shadow);
    }
    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
    .panel-title svg { color: var(--accent); }
    .panel-desc { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .panel-body { padding: 16px 20px 20px; }
    .stack { display: grid; gap: 16px; }
    .preferences { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .preference { padding: 18px 20px 20px; }
    .preference h4 { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .preference h4 svg { color: var(--accent); }
    .preference p { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 17px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }
    .control-label { color: var(--dim); font: 9px/1.2 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    select, .fake-input {
      min-width: 130px;
      padding: 7px 10px;
      border: 1px solid var(--line2);
      border-radius: 9px;
      outline: none;
      color: var(--ink);
      background: var(--card2);
      font-size: 11px;
    }
    .segmented { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--card2); }
    .segmented span { padding: 5px 8px; border-radius: 7px; color: var(--muted); font-size: 10px; }
    .segmented span.active { color: var(--accent-ink); background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid var(--line2);
      border-radius: 9px;
      color: var(--ink);
      background: var(--card);
      font-size: 11px;
      font-weight: 650;
    }
    .button.primary { border-color: transparent; color: white; background: var(--accent); box-shadow: 0 4px 12px var(--accent-shadow); }
    .button:hover { border-color: var(--accent); }
    .button.primary:hover { border-color: transparent; filter: brightness(1.05); }
    .button.subtle { padding: 5px 8px; border: 0; color: var(--accent-ink); background: transparent; }
    .button.subtle:hover { background: var(--accent-soft); }

    /* Shared Learning Engine block */
    .engine-panel { scroll-margin-top: 22px; }
    .engine-panel .panel-head { align-items: center; }
    .engine-heading { display: flex; align-items: flex-start; gap: 11px; }
    .engine-icon {
      display: grid;
      width: 31px;
      height: 31px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 11px;
      color: var(--hi);
      background: var(--hi-soft);
    }
    .health-summary {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border: 1px solid color-mix(in srgb, var(--ok) 34%, var(--line));
      border-radius: 12px;
      color: var(--ok);
      background: var(--ok-soft);
    }
    .health-summary.attention { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); color: var(--warn); background: var(--warn-soft); }
    .health-summary strong { display: block; font-size: 12px; }
    .health-summary small { display: block; margin-top: 3px; color: color-mix(in srgb, currentColor 72%, var(--muted)); font: 9px/1.3 'JetBrains Mono', monospace; }
    .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .metric { min-width: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: color-mix(in srgb, var(--card2) 58%, transparent); }
    .metric-label { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .metric-value { margin-top: 6px; font: 600 23px/1 'JetBrains Mono', monospace; letter-spacing: -.06em; }
    .metric-value.ok { color: var(--ok); }
    .metric-value.warn { color: var(--warn); }
    .metric-note { margin-top: 5px; color: var(--dim); font-size: 9px; }
    .engine-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
    .hygiene-copy { display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
    .hygiene-copy svg { flex: 0 0 auto; margin-top: 2px; color: var(--hi); }
    .hygiene-copy strong { display: block; font-size: 11px; }
    .hygiene-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .last-check { color: var(--dim); font: 9px/1.4 'JetBrains Mono', monospace; white-space: nowrap; }

    /* Variant A: health as the first-class status card */
    .variant-a .health-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 16px;
      align-items: stretch;
    }
    .status-card { display: flex; flex-direction: column; justify-content: space-between; padding: 20px; border: 1px solid color-mix(in srgb, var(--ok) 34%, var(--line)); border-radius: 18px; background: linear-gradient(145deg, var(--card), var(--ok-soft)); box-shadow: var(--shadow); }
    .status-card.attention { border-color: color-mix(in srgb, var(--warn) 42%, var(--line)); background: linear-gradient(145deg, var(--card), var(--warn-soft)); }
    .status-card-label { color: var(--muted); font: 9px/1 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    .status-card h3 { margin-top: 13px; font: 600 29px/.98 Newsreader, Georgia, serif; }
    .status-card p { max-width: 190px; margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .status-card .mini-row { display: flex; align-items: center; gap: 8px; margin-top: 20px; color: var(--ok); font: 9px/1.3 'JetBrains Mono', monospace; }
    .status-card.attention .mini-row { color: var(--warn); }
    .variant-a .engine-panel { margin-top: 16px; }
    .variant-a .config-panel { margin-top: 16px; }

    /* Variant B: settings chapter navigation */
    .variant-b .hero { padding-bottom: 17px; }
    .settings-layout { display: grid; grid-template-columns: 178px minmax(0, 1fr); gap: 26px; align-items: start; }
    .settings-index { position: sticky; top: 20px; padding-top: 4px; }
    .settings-index-label { margin-bottom: 9px; color: var(--dim); font: 9px/1 'JetBrains Mono', monospace; letter-spacing: .13em; text-transform: uppercase; }
    .settings-index a { display: block; padding: 8px 10px; border-left: 2px solid transparent; border-radius: 0 8px 8px 0; color: var(--muted); font-size: 11px; text-decoration: none; }
    .settings-index a:hover, .settings-index a.current { border-left-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft); }
    .settings-index .index-note { margin: 25px 10px 0; padding-top: 13px; border-top: 1px solid var(--line); color: var(--dim); font-size: 10px; line-height: 1.5; }
    .variant-b .engine-panel { border-radius: 14px; }
    .variant-b .engine-panel .panel-head { padding: 14px 16px; }
    .variant-b .engine-panel .panel-body { padding: 13px 16px 16px; }
    .variant-b .health-summary { padding: 8px 10px; }
    .variant-b .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .variant-b .metrics .metric:last-child { display: none; }
    .variant-b .preferences { grid-template-columns: 1fr; }
    .variant-b .config-panel { margin-top: 16px; }

    /* Variant D: B's fixed chapter rail + C's merged runtime signal */
    .variant-d .hero { padding-bottom: 17px; }
    .variant-d .settings-layout { grid-template-columns: 188px minmax(0, 1fr); gap: 24px; }
    .variant-d .settings-index { position: sticky; top: 76px; max-height: calc(100svh - 98px); overflow-y: auto; align-self: start; scrollbar-width: thin; }
    .variant-d .settings-index a:first-of-type { color: var(--ok); }
    .variant-d .settings-index .index-note { margin-top: 22px; }
    .variant-d .section-label:first-child { margin-top: 0; }
    .variant-d .engine-panel { margin-top: 16px; }
    .variant-d .engine-panel .panel-head { padding-bottom: 13px; }
    .variant-d .engine-panel .panel-body { padding-top: 13px; }
    .variant-d .runtime-caption { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
    .variant-d .runtime-caption .dot { width: 5px; height: 5px; color: var(--ok); }
    .engine-unified .panel-body { padding-top: 12px; }
    .engine-unified .health-summary { padding: 8px 10px; }
    .engine-unified .health-summary small { max-width: 145px; }
    .engine-unified .engine-footer { margin-top: 14px; }

    /* Variant C: operations band first */
    .operations-band { display: grid; grid-template-columns: minmax(0, 1.25fr) repeat(3, minmax(100px, .55fr)); gap: 1px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--ok) 36%, var(--line)); border-radius: 16px; background: color-mix(in srgb, var(--ok) 32%, var(--line)); box-shadow: var(--shadow); }
    .operations-lead, .operations-stat { min-height: 102px; padding: 16px; background: var(--card); }
    .operations-lead { background: linear-gradient(145deg, var(--card), var(--ok-soft)); }
    .operations-lead.attention { background: linear-gradient(145deg, var(--card), var(--warn-soft)); }
    .operations-lead .overline { color: var(--muted); font: 9px/1 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    .operations-lead h3 { margin-top: 10px; font: 600 25px/1 Newsreader, Georgia, serif; }
    .operations-lead p { margin-top: 5px; color: var(--muted); font-size: 10px; }
    .operations-stat { display: flex; flex-direction: column; justify-content: center; }
    .operations-stat span { color: var(--muted); font-size: 10px; }
    .operations-stat strong { margin-top: 6px; font: 600 22px/1 'JetBrains Mono', monospace; }
    .operations-stat small { margin-top: 5px; color: var(--dim); font-size: 9px; }
    .operations-stat strong.ok { color: var(--ok); }
    .operations-stat strong.warn { color: var(--warn); }
    .variant-c .content-columns { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap: 16px; margin-top: 16px; align-items: start; }
    .variant-c .config-panel .panel-body { min-height: 285px; }
    .route-list { display: grid; gap: 9px; }
    .route-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--card2); }
    .route-row strong { display: block; font-size: 11px; }
    .route-row span { display: block; margin-top: 3px; color: var(--muted); font: 9px/1.3 'JetBrains Mono', monospace; }
    .route-state { display: inline-flex; align-items: center; gap: 5px; color: var(--ok); font: 9px/1 'JetBrains Mono', monospace; white-space: nowrap; }
    .route-state .dot { width: 5px; height: 5px; }
    .activity { display: grid; gap: 0; }
    .activity-row { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .activity-row:last-child { border-bottom: 0; }
    .activity-mark { display: grid; width: 17px; height: 17px; place-items: center; border-radius: 50%; color: var(--ok); background: var(--ok-soft); font-size: 9px; }
    .activity-row strong { display: block; font-size: 10px; }
    .activity-row span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.4; }
    .activity-time { color: var(--dim); font: 9px/1.3 'JetBrains Mono', monospace; }
    .variant-c .engine-panel { margin-top: 16px; }

    /* Floating prototype controls */
    .switcher {
      position: fixed;
      z-index: 20;
      right: 50%;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      color: #e6edf4;
      background: rgba(18, 27, 34, .93);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
      transform: translateX(50%);
      backdrop-filter: blur(12px);
    }
    .switcher button { display: grid; width: 25px; height: 25px; place-items: center; border: 0; border-radius: 50%; color: #b7c5cf; background: transparent; }
    .switcher button:hover { color: white; background: rgba(255,255,255,.12); }
    .switcher-label { min-width: 190px; text-align: center; font: 10px/1.2 'JetBrains Mono', monospace; }
    .switcher-label strong { color: #fff; }
    .switcher-label span { color: #94a6b4; }
    .switcher-divider { width: 1px; height: 16px; background: rgba(255,255,255,.18); }
    .state-toggle { color: #a7b7c2; font: 9px/1 'JetBrains Mono', monospace; white-space: nowrap; }
    .state-toggle:hover { color: white; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .page > * { animation: rise .42s cubic-bezier(.2,.8,.2,1) both; }
    .page > *:nth-child(2) { animation-delay: .06s; }
    .page > *:nth-child(3) { animation-delay: .12s; }
    .page > *:nth-child(4) { animation-delay: .18s; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 820px) {
      .topbar { gap: 10px; padding-inline: 14px; }
      .brand small { display: none; }
      .nav span { padding-inline: 8px; }
      .page { width: min(100% - 28px, 680px); }
      .hero { align-items: flex-start; flex-direction: column; }
      .hero-aside { justify-items: start; }
      .variant-a .health-hero, .variant-c .content-columns { grid-template-columns: 1fr; }
      .variant-d .settings-layout { grid-template-columns: 1fr; gap: 14px; }
      .settings-layout { grid-template-columns: 1fr; gap: 14px; }
      .settings-index { position: static; display: flex; gap: 5px; overflow: auto; padding: 2px 0 7px; border-bottom: 1px solid var(--line); }
      .settings-index-label, .settings-index .index-note { display: none; }
      .settings-index a { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
      .settings-index a:hover, .settings-index a.current { border-bottom-color: var(--accent); border-left: 0; }
      .variant-d .settings-index a:first-of-type { border-bottom-color: var(--ok); }
      .operations-band { grid-template-columns: 1fr 1fr; }
      .operations-lead { grid-column: 1 / -1; }
      .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .metric:last-child { display: none; }
    }
    @media (max-width: 560px) {
      .prototype-meta { display: block; }
      .prototype-meta p { margin-top: 6px; }
      .frame { width: calc(100% - 16px); border-radius: 13px; }
      .top-actions { gap: 4px; }
      .engine-pill { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
      .page { width: calc(100% - 28px); padding-top: 14px; }
      .hero h2 { font-size: 38px; }
      .preferences { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .engine-panel .panel-head { display: block; }
      .engine-panel .health-summary { margin-top: 12px; }
      .engine-footer { align-items: flex-start; flex-direction: column; }
      .operations-band { grid-template-columns: 1fr; }
      .operations-lead { grid-column: auto; }
      .switcher { bottom: 10px; gap: 6px; max-width: calc(100% - 20px); }
      .switcher-label { min-width: 145px; }
      .state-toggle { display: none; }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="prototype-meta">
    <h1>Agent Context · Learning Engine × Settings</h1>
    <p>prototype · four information architectures</p>
  </div>
  <main class="frame">
    <div id="app" class="app"></div>
  </main>

  <div class="switcher" aria-label="Prototype variant switcher">
    <button id="previous" type="button" aria-label="Previous variant">←</button>
    <div id="variant-label" class="switcher-label"></div>
    <button id="next" type="button" aria-label="Next variant">→</button>
    <div class="switcher-divider"></div>
    <button id="state-toggle" class="state-toggle" type="button">切换为需要关注</button>
  </div>

  <script>
    const icons = {
      spark: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 1.6 6.4L20 11l-6.4 1.6L12 19l-1.6-6.4L4 11l6.4-1.6L12 3Z"/><path d="m19 3 .6 2.4L22 6l-2.4.6L19 9l-.6-2.4L16 6l2.4-.6L19 3Z"/></svg>',
      sun: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>',
      globe: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.3 2.5 3.4 5.5 3.4 9s-1.1 6.5-3.4 9c-2.3-2.5-3.4-5.5-3.4-9S9.7 5.5 12 3Z"/></svg>',
      activity: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2.2-7 4.1 14 2.4-7H21"/></svg>',
      refresh: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 11a8 8 0 0 0-14.9-3L3 11"/><path d="M3 5v6h6M4 13a8 8 0 0 0 14.9 3L21 13"/><path d="M21 19v-6h-6"/></svg>',
      wand: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m15 4 5 5M13 6l5 5L8 21H3v-5L13 6Z"/><path d="M4 3v4M2 5h4M19 15v4M17 17h4"/></svg>',
      check: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 4 4L19 6"/></svg>',
      chevron: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>'
    };

    const variants = {
      a: { name: 'A · 状态优先', note: 'Settings 首屏摘要', render: renderA },
      b: { name: 'B · 章节导航', note: 'Settings 结构化分区', render: renderB },
      c: { name: 'C · 运维优先', note: '运行状态带', render: renderC },
      d: { name: 'D · B + C 优化', note: '固定导航 × 合并运行状态', render: renderD }
    };
    const order = ['a', 'b', 'c', 'd'];
    const params = new URLSearchParams(location.search);
    let variant = variants[params.get('variant')] ? params.get('variant') : 'd';
    let attention = false;

    function shell(content, className) {
      return `
        <header class="topbar">
          <div class="brand">
            <span class="brand-mark">✦</span>
            <span>Agent Context<small>context layer</small></span>
          </div>
          <nav class="nav" aria-label="Primary navigation">
            <span>知识</span><span>复查</span><span>技能</span><span>分析</span><span class="active">设置</span>
          </nav>
          <div class="top-actions">
            <button id="engine-pill" class="engine-pill" type="button" title="点击切换预览状态">
              <span class="dot"></span><span class="engine-label">引擎在线 · 队列 0</span>
            </button>
            <button id="theme-button" class="theme-button" type="button" aria-label="Toggle theme">☼</button>
          </div>
        </header>
        <div class="page ${className}">${content}</div>`;
    }

    function hero(copy, aside) {
      return `<section class="hero"><div class="hero-copy"><div class="kicker">platform settings / runtime</div><h2>把平台调成<br>适合长期运行的样子。</h2><p>${copy}</p></div><div class="hero-aside">${aside}</div></section>`;
    }

    function preferences() {
      return `<div class="preferences">
        <section class="panel preference" id="preferences"><h4>${icons.sun} 外观</h4><p>平台级外观，对所有浏览器生效。</p><div class="control"><span class="control-label">主题</span><div class="segmented"><span>亮色</span><span class="active">暗色</span><span>系统</span></div></div></section>
        <section class="panel preference"><h4>${icons.globe} 语言</h4><p>界面、后端错误消息与新知识提取所使用的语言。</p><div class="control"><span class="control-label">平台语言</span><select aria-label="Platform language"><option>中文 (简体)</option><option>English</option></select></div></section>
      </div>`;
    }

    function inferencePanel(compact = false) {
      return `<section class="panel config-panel" id="inference"><div class="panel-head"><div><div class="panel-title">${icons.spark} Inference 配置</div><p class="panel-desc">Chat 与 Embedding 分别绑定到可复用的 OpenAI 兼容 provider。保存前必须通过验证。</p></div><span class="badge ok"><span class="dot"></span>已验证</span></div><div class="panel-body">
        <div class="route-list">
          <div class="route-row"><div><strong>Chat route</strong><span>OpenAI compatible · gpt-4.1-mini</span></div><span class="route-state"><span class="dot"></span>ready</span></div>
          <div class="route-row"><div><strong>Embedding route</strong><span>Local gateway · text-embedding-3-small</span></div><span class="route-state"><span class="dot"></span>ready</span></div>
        </div>
        ${compact ? '' : '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)"><span class="panel-desc" style="margin:0">更改保存后立即生效，无需重启。</span><button class="button primary" type="button">编辑配置</button></div>'}
      </div></section>`;
    }

    function enginePanel(compact = false) {
      return `<section class="panel engine-panel" id="engine-health"><div class="panel-head"><div class="engine-heading"><span class="engine-icon">${icons.activity}</span><div><div class="panel-title">Learning Engine · 运行状态</div><p class="panel-desc">观察队列、失败/重试与知识卫生；这里是运维状态，不是基础存活探针。</p></div></div><div class="health-summary"><span class="dot"></span><div><strong class="health-copy-title">运行正常</strong><small>最后检查 · 刚刚</small></div></div></div><div class="panel-body"><div class="metrics">
        <div class="metric"><div class="metric-label">排队中</div><div class="metric-value ok">0</div><div class="metric-note">没有等待处理</div></div>
        <div class="metric"><div class="metric-label">处理中</div><div class="metric-value">1</div><div class="metric-note">当前 worker</div></div>
        <div class="metric"><div class="metric-label">失败</div><div class="metric-value ${attention ? 'warn' : 'ok'}">${attention ? '2' : '0'}</div><div class="metric-note">${attention ? '需要查看' : '无失败会话'}</div></div>
        <div class="metric"><div class="metric-label">已安排重试</div><div class="metric-value ${attention ? 'warn' : 'ok'}">${attention ? '1' : '0'}</div><div class="metric-note">${attention ? '退避中' : '队列稳定'}</div></div>
        <div class="metric"><div class="metric-label">总会话</div><div class="metric-value">128</div><div class="metric-note">已接收</div></div>
      </div><div class="engine-footer"><div class="hygiene-copy">${icons.wand}<div><strong>知识卫生</strong><span>定时衰减、转入复查并归档长期未动的知识。</span></div></div><div style="display:flex;align-items:center;gap:12px"><span class="last-check">上次运行 · 08:42</span><button class="button" type="button">${icons.refresh} 立即运行</button></div></div></div></section>`;
    }

    function unifiedEnginePanel() {
      return `<section class="panel engine-panel engine-unified" id="engine-health"><div class="panel-head"><div class="engine-heading"><span class="engine-icon">${icons.activity}</span><div><div class="panel-title">Learning Engine · 运行状态</div><p class="panel-desc">运行摘要、队列指标与知识卫生合并在同一处；基础存活探针仍由系统接口负责。</p></div></div><div class="health-summary"><span class="dot"></span><div><strong class="health-copy-title">运行正常</strong><small class="health-copy-subtitle">队列 0 · 最后检查刚刚</small></div></div></div><div class="panel-body"><div class="metrics">
        <div class="metric"><div class="metric-label">排队中</div><div class="metric-value ok">0</div><div class="metric-note">没有等待处理</div></div>
        <div class="metric"><div class="metric-label">处理中</div><div class="metric-value">1</div><div class="metric-note">当前 worker</div></div>
        <div class="metric"><div class="metric-label">失败</div><div class="metric-value ${attention ? 'warn' : 'ok'}">${attention ? '2' : '0'}</div><div class="metric-note">${attention ? '需要查看' : '无失败会话'}</div></div>
        <div class="metric"><div class="metric-label">已安排重试</div><div class="metric-value ${attention ? 'warn' : 'ok'}">${attention ? '1' : '0'}</div><div class="metric-note">${attention ? '退避中' : '队列稳定'}</div></div>
        <div class="metric"><div class="metric-label">总会话</div><div class="metric-value">128</div><div class="metric-note">已接收</div></div>
      </div><div class="engine-footer"><div class="hygiene-copy">${icons.wand}<div><strong>知识卫生</strong><span>定时衰减、转入复查并归档长期未动的知识。</span></div></div><div style="display:flex;align-items:center;gap:12px"><span class="last-check">上次运行 · 08:42</span><button class="button" type="button">${icons.refresh} 立即运行</button></div></div></div></section>`;
    }

    function activityPanel() {
      return `<section class="panel"><div class="panel-head"><div><div class="panel-title">${icons.activity} 最近活动</div><p class="panel-desc">把“健康”从一个抽象标签变成可解释的信号。</p></div><button class="button subtle" type="button">查看全部 →</button></div><div class="panel-body activity">
        <div class="activity-row"><div class="activity-mark">${icons.check}</div><div><strong>Embedding route 检查通过</strong><span>1536 dimensions · local gateway</span></div><div class="activity-time">刚刚</div></div>
        <div class="activity-row"><div class="activity-mark">${icons.check}</div><div><strong>知识卫生运行完成</strong><span>0 decayed · 0 moved · 0 archived</span></div><div class="activity-time">08:42</div></div>
        <div class="activity-row"><div class="activity-mark">${icons.check}</div><div><strong>Learning Engine 已启动</strong><span>worker 1 · Postgres queue</span></div><div class="activity-time">08:00</div></div>
      </div></section>`;
    }

    function renderA() {
      const aside = '<span class="badge accent">平台级设置</span><span class="badge">无需重启</span>';
      return shell(`${hero('管理外观、语言、模型服务和 Learning Engine 的运行状态。状态摘要会与顶部标识保持一致。', aside)}
        <div class="health-hero"><div>${preferences()}</div><section class="status-card"><div><div class="status-card-label">runtime signal</div><h3 class="status-card-title">引擎在线</h3><p class="status-card-copy">队列稳定，后台知识处理没有积压。</p></div><div class="mini-row"><span class="dot"></span><span>刚刚检查 · Postgres queue</span></div></section></div>
        <div class="section-label"><h3>模型服务</h3><p>Inference routes</p></div>${inferencePanel()}
        <div class="section-label"><h3>运行状态</h3><p>Learning Engine operations</p></div>${enginePanel()}`, 'variant-a');
    }

    function renderB() {
      const aside = '<span class="badge accent">平台级设置</span><span class="badge">5 分钟前检查</span>';
      return shell(`${hero('把长期需要调整的偏好、模型服务与运维观察组织成同一页，但每个分区保持自己的节奏。', aside)}
        <div class="settings-layout"><aside class="settings-index"><div class="settings-index-label">On this page</div><a href="#preferences" class="current">偏好</a><a href="#inference">模型服务</a><a href="#engine-health">运行状态</a><p class="index-note">顶部状态点是入口；详细状态在这里展开。</p></aside><div class="stack">${preferences()}${inferencePanel(true)}${enginePanel(true)}</div></div>`, 'variant-b');
    }

    function renderD() {
      const aside = '<span class="badge accent">平台级设置</span><span class="badge">状态已同步</span>';
      return shell(`${hero('保留 Settings 的固定章节导航，把顶部运行摘要与 Learning Engine 详情合并成一个状态模块。顶部标识只保留同一状态的最小入口。', aside)}
        <div class="settings-layout"><aside class="settings-index"><div class="settings-index-label">On this page</div><a href="#engine-health" class="current">Learning Engine</a><a href="#preferences">偏好</a><a href="#inference">模型服务</a><p class="index-note">先看运行状态，再进入配置；顶部状态点和这里的运行状态始终保持一致。</p></aside><div class="stack">
          <div class="section-label"><h3>运行状态</h3><p class="runtime-caption"><span class="dot"></span>Learning Engine</p></div>${unifiedEnginePanel()}
          <div class="section-label"><h3>平台配置</h3><p>Preferences</p></div>${preferences()}${inferencePanel(true)}
        </div></div>`, 'variant-d');
    }

    function renderC() {
      return shell(`${hero('先告诉你平台现在是否值得信任，再让你进入配置与维护动作。顶部状态标识是同一条运行状态带的最小版本。', '<span class="badge accent">平台级设置</span>')}
        <section class="operations-band" id="engine-health"><div class="operations-lead"><div class="overline">Learning Engine · runtime</div><h3 class="operations-title">一切运行正常</h3><p class="operations-copy">队列 0 · 无失败 · 最近检查刚刚完成</p></div><div class="operations-stat"><span>排队中</span><strong class="ok">0</strong><small>稳定</small></div><div class="operations-stat"><span>失败 / 重试</span><strong class="${attention ? 'warn' : 'ok'}">${attention ? '2 / 1' : '0 / 0'}</strong><small>${attention ? '需要关注' : '无异常'}</small></div><div class="operations-stat"><span>知识卫生</span><strong class="ok">OK</strong><small>上次 · 08:42</small></div></section>
        <div class="content-columns"><div class="stack"><div class="section-label" style="margin-top:0"><h3>模型服务</h3><p>Inference routes</p></div>${inferencePanel()}${preferences()}</div><div class="stack"><div class="section-label" style="margin-top:0"><h3>运维动作</h3><p>解释与处理</p></div>${activityPanel()}<section class="panel"><div class="panel-head"><div><div class="panel-title">${icons.wand} 知识卫生</div><p class="panel-desc">清理长期未使用的知识条目。</p></div></div><div class="panel-body" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span class="panel-desc" style="margin:0">定时任务正常运行</span><button class="button" type="button">${icons.refresh} 立即运行</button></div></section></div></div>`, 'variant-c');
    }

    function render() {
      document.body.dataset.theme = document.body.dataset.theme || 'dark';
      document.getElementById('app').innerHTML = variants[variant].render();
      document.getElementById('variant-label').innerHTML = `<strong>${variants[variant].name}</strong><br><span>${variants[variant].note}</span>`;
      document.getElementById('state-toggle').textContent = attention ? '切换为正常' : '切换为需要关注';
      applyAttention();
      document.getElementById('theme-button').addEventListener('click', () => {
        document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark';
      });
      document.getElementById('engine-pill').addEventListener('click', () => {
        attention = !attention;
        render();
      });
    }

    function applyAttention() {
      document.querySelectorAll('.health-summary, .status-card, .operations-lead').forEach(el => el.classList.toggle('attention', attention));
      document.querySelectorAll('.health-copy-title').forEach(el => el.textContent = attention ? '需要关注' : '运行正常');
      document.querySelectorAll('.health-copy-subtitle').forEach(el => el.textContent = attention ? '失败 2 · 重试 1' : '队列 0 · 最后检查刚刚');
      document.querySelectorAll('.status-card-title').forEach(el => el.textContent = attention ? '出现积压' : '引擎在线');
      document.querySelectorAll('.status-card-copy').forEach(el => el.textContent = attention ? '有失败会话正在等待重试，建议查看最近活动。' : '队列稳定，后台知识处理没有积压。');
      document.querySelectorAll('.operations-title').forEach(el => el.textContent = attention ? '需要关注' : '一切运行正常');
      document.querySelectorAll('.operations-copy').forEach(el => el.textContent = attention ? '失败 2 · 重试 1 · 最近检查刚刚完成' : '队列 0 · 无失败 · 最近检查刚刚完成');
      const pill = document.getElementById('engine-pill');
      if (pill) {
        pill.classList.toggle('attention', attention);
        pill.querySelector('.engine-label').textContent = attention ? '需要关注 · 2 个失败' : '引擎在线 · 队列 0';
      }
    }

    function move(delta) {
      const current = order.indexOf(variant);
      variant = order[(current + delta + order.length) % order.length];
      const next = new URL(location.href);
      next.searchParams.set('variant', variant);
      history.replaceState(null, '', next);
      render();
    }

    document.getElementById('previous').addEventListener('click', () => move(-1));
    document.getElementById('next').addEventListener('click', () => move(1));
    document.getElementById('state-toggle').addEventListener('click', () => { attention = !attention; render(); });
    document.addEventListener('keydown', event => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
    });
    render();
  </script>
</body>
</html>
