<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Context — Skills 管理原型</title>
  <style>
    /* PROTOTYPE — three structural directions for the Skills management page.
       Question: which information hierarchy makes discovering and maintaining
       skills feel most natural? This file is intentionally not production UI. */
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap');

    :root {
      --paper: #eef2f6;
      --surface: rgba(255, 255, 255, .84);
      --surface-solid: #ffffff;
      --ink: #182533;
      --muted: #687789;
      --dim: #94a1ae;
      --line: rgba(38, 67, 95, .14);
      --line-strong: rgba(38, 67, 95, .24);
      --blue: #2f6fc8;
      --blue-soft: #e2edfc;
      --amber: #d98e4a;
      --amber-soft: #fbeddc;
      --teal: #2b8a80;
      --danger: #c65d5d;
      --code: #132131;
      --code-ink: #d9e7f2;
      --shadow: 0 18px 55px rgba(35, 61, 88, .14);
      --small-shadow: 0 5px 18px rgba(35, 61, 88, .09);
    }

    [data-theme="dark"] {
      --paper: #15202b;
      --surface: rgba(29, 43, 57, .94);
      --surface-solid: #1d2b39;
      --ink: #e5edf4;
      --muted: #a3b2c1;
      --dim: #718394;
      --line: rgba(191, 218, 239, .13);
      --line-strong: rgba(191, 218, 239, .26);
      --blue: #84c3ec;
      --blue-soft: rgba(132, 195, 236, .15);
      --amber: #efb27b;
      --amber-soft: rgba(239, 178, 123, .14);
      --teal: #77c6bb;
      --danger: #f18b8b;
      --code: #0d1722;
      --code-ink: #d6e5f1;
      --shadow: 0 18px 55px rgba(0, 0, 0, .28);
      --small-shadow: 0 5px 18px rgba(0, 0, 0, .22);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 88px;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 2%, rgba(132, 195, 236, .18), transparent 24rem),
        radial-gradient(circle at 95% 14%, rgba(217, 142, 74, .14), transparent 21rem),
        #0f1923;
      font-family: 'Instrument Sans', sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .prototype-meta { max-width: 1180px; margin: 0 auto 18px; display: flex; justify-content: space-between; gap: 16px; align-items: baseline; color: #dce7ef; }
    .prototype-meta h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .01em; }
    .prototype-meta p { margin: 0; font: 11px 'JetBrains Mono', monospace; color: #9db1c1; }
    .app { max-width: 1180px; min-height: 760px; margin: 0 auto; overflow: hidden; border: 1px solid rgba(255,255,255,.12); border-radius: 17px; box-shadow: 0 35px 90px rgba(0,0,0,.38); background: var(--paper); }
    .topbar { min-height: 66px; display: flex; align-items: center; gap: 18px; padding: 0 25px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--surface-solid) 83%, transparent); }
    .brand { display: flex; align-items: center; gap: 9px; white-space: nowrap; font-size: 14px; font-weight: 600; }
    .brand-mark { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 8px; color: white; background: linear-gradient(145deg, var(--blue), var(--teal)); font-size: 13px; font-weight: 700; box-shadow: 0 4px 10px rgba(47,111,200,.23); }
    .nav { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: auto; }
    .nav button { border: 0; border-radius: 999px; padding: 8px 12px; color: var(--muted); background: transparent; font-size: 12px; white-space: nowrap; }
    .nav button.active { color: var(--blue); background: var(--blue-soft); font-weight: 600; }
    .engine { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
    .engine i { width: 7px; height: 7px; display: block; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 4px color-mix(in srgb, var(--teal) 17%, transparent); }
    .theme { display: flex; gap: 2px; margin-left: 5px; padding: 3px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
    .theme button { border: 0; border-radius: 6px; padding: 4px 7px; color: var(--dim); background: transparent; font-size: 10px; }
    .theme button.active { color: var(--ink); background: var(--surface-solid); box-shadow: var(--small-shadow); }
    .content { padding: 27px 28px 34px; }
    .page-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 20px; }
    .eyebrow { margin: 0 0 5px; color: var(--amber); font: 10px 'JetBrains Mono', monospace; letter-spacing: .13em; text-transform: uppercase; }
    h2, h3, h4, p { margin-top: 0; }
    h2 { margin-bottom: 5px; font: 600 29px 'Newsreader', serif; letter-spacing: -.025em; }
    .lead { max-width: 620px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 12px; color: var(--ink); background: var(--surface); font-size: 12px; font-weight: 500; }
    .btn:hover { border-color: var(--blue); transform: translateY(-1px); }
    .btn.primary { border-color: var(--blue); color: #fff; background: var(--blue); }
    .btn.amber { border-color: transparent; color: #fff; background: var(--amber); }
    .btn.small { padding: 6px 9px; font-size: 11px; }
    .btn.ghost { border-color: transparent; background: transparent; }
    .icon { width: 15px; height: 15px; display: inline-block; line-height: 1; font-size: 14px; }
    .surface { border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: var(--small-shadow); }
    .section-label { color: var(--dim); font: 10px 'JetBrains Mono', monospace; letter-spacing: .13em; text-transform: uppercase; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .muted { color: var(--muted); }
    .tiny { color: var(--dim); font-size: 10.5px; }
    .tag { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); font: 10px 'JetBrains Mono', monospace; }
    .tag.blue { border-color: transparent; color: var(--blue); background: var(--blue-soft); }
    .tag.amber { border-color: transparent; color: var(--amber); background: var(--amber-soft); }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { color: var(--muted); font-size: 11px; font-weight: 600; }
    .field input, .field textarea, .search-box input { width: 100%; border: 1px solid var(--line-strong); border-radius: 8px; outline: 0; color: var(--ink); background: var(--surface-solid); padding: 9px 10px; font-size: 12px; }
    .field input:focus, .field textarea:focus, .search-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .field textarea { min-height: 100px; resize: vertical; font-family: 'JetBrains Mono', monospace; line-height: 1.55; }

    /* Variant A: the existing product's split-pane workbench, with explicit entry actions. */
    .a-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
    .inventory-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 14px; border-bottom: 1px solid var(--line); }
    .inventory-tabs { display: flex; gap: 3px; padding: 9px 11px; border-bottom: 1px solid var(--line); }
    .inventory-tabs button { flex: 1; border: 0; border-radius: 6px; padding: 6px 4px; color: var(--muted); background: transparent; font-size: 10.5px; }
    .inventory-tabs button.active { color: var(--blue); background: var(--blue-soft); font-weight: 600; }
    .skill-list { padding: 5px; }
    .skill-row { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 11px 9px; text-align: left; color: var(--ink); background: transparent; }
    .skill-row:last-child { border-bottom: 0; }
    .skill-row:hover, .skill-row.active { background: var(--blue-soft); }
    .skill-row.active::before { content: ''; position: absolute; inset: 9px auto 9px 0; width: 3px; border-radius: 3px; background: var(--blue); }
    .skill-glyph { width: 29px; height: 29px; display: grid; place-items: center; flex: none; border: 1px solid var(--line); border-radius: 8px; color: var(--blue); background: var(--surface-solid); font-size: 13px; }
    .skill-row strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
    .skill-row small { display: block; margin-top: 2px; color: var(--dim); font: 10px 'JetBrains Mono', monospace; }
    .skill-row .version { margin-left: auto; color: var(--muted); font: 10px 'JetBrains Mono', monospace; }
    .detail-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .detail-head h3 { margin: 0 0 3px; font-size: 16px; }
    .detail-head .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; justify-content: flex-end; }
    .detail-toolbar { display: flex; flex-wrap: wrap; gap: 7px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
    .a-body { display: grid; grid-template-columns: 195px minmax(0,1fr); min-height: 485px; }
    .tree { padding: 13px 9px; border-right: 1px solid var(--line); }
    .tree-head { display: flex; justify-content: space-between; align-items: center; padding: 0 5px 8px; }
    .tree-row { display: flex; align-items: center; gap: 6px; width: 100%; border: 0; border-radius: 6px; padding: 6px 7px; text-align: left; color: var(--muted); background: transparent; font: 10.5px 'JetBrains Mono', monospace; }
    .tree-row:hover, .tree-row.active { color: var(--ink); background: var(--blue-soft); }
    .tree-row.folder { color: var(--amber); }
    .tree-indent { padding-left: 18px; }
    .editor { min-width: 0; padding: 16px 18px; }
    .editor-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 12px; }
    .editor-head .path { color: var(--muted); font: 10.5px 'JetBrains Mono', monospace; }
    .markdown { color: var(--muted); font-size: 12px; line-height: 1.7; }
    .markdown h4 { margin: 0 0 12px; color: var(--ink); font: 600 23px 'Newsreader', serif; }
    .markdown h5 { margin: 17px 0 4px; color: var(--ink); font-size: 12px; }
    .note { margin: 14px 0; border-left: 3px solid var(--amber); border-radius: 0 7px 7px 0; padding: 9px 11px; color: var(--ink); background: var(--amber-soft); font-size: 11.5px; }
    .code { overflow: auto; border-radius: 9px; padding: 12px 13px; color: var(--code-ink); background: var(--code); font: 11px/1.65 'JetBrains Mono', monospace; }

    /* Variant B: the installed library is the home surface. Discovery is a
       deliberate secondary action, while the discovery screen still follows
       Settings / Setup: editorial hero, status badges, 20px panels, explicit
       steps, and a verification/readiness aside. */
    .b-hero-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; padding: 30px 0 24px; }
    .b-hero-copy { min-width: 0; }
    .b-hero-head h2 { margin: 0; font-size: clamp(32px, 5vw, 48px); line-height: .98; letter-spacing: -.045em; }
    .b-hero-head .lead { max-width: 680px; margin-top: 14px; font-size: 14px; line-height: 1.7; }
    .b-hero-aside { display: grid; justify-items: end; align-content: start; gap: 8px; flex: 0 0 auto; }
    .b-badge, .b-status { display: inline-flex; align-items: center; gap: 6px; width: fit-content; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; color: var(--muted); background: var(--surface-solid); font-size: 11px; white-space: nowrap; }
    .b-badge { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 25%, var(--line)); background: var(--blue-soft); }
    .b-badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); }
    .b-flow { display: flex; align-items: center; gap: 10px; margin: 0 0 22px; border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 12px; }
    .b-flow-step { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 0; color: var(--muted); background: transparent; font-size: 12px; }
    .b-flow-step.active { color: var(--ink); font-weight: 700; }
    .b-flow-step span { display: grid; width: 20px; height: 20px; place-items: center; border: 1px solid color-mix(in srgb, var(--blue) 36%, var(--line)); border-radius: 50%; color: white; background: var(--blue); font: 10px 'JetBrains Mono', monospace; box-shadow: 0 3px 8px color-mix(in srgb, var(--blue) 36%, transparent); }
    .b-flow-separator { color: var(--dim); }
    .b-layout { display: grid; grid-template-columns: minmax(260px, .82fr) minmax(0, 1.5fr); gap: 18px; align-items: start; }
    .b-stack { display: grid; gap: 18px; min-width: 0; }
    .b-readiness, .b-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: color-mix(in srgb, var(--surface-solid) 94%, transparent); box-shadow: var(--shadow); backdrop-filter: blur(6px); }
    .b-readiness { position: sticky; top: 20px; padding: 22px; background: linear-gradient(145deg, color-mix(in srgb, var(--surface-solid) 94%, transparent), var(--blue-soft)); }
    .b-readiness-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 15px; color: var(--amber); background: var(--amber-soft); font-size: 21px; }
    .b-readiness h3 { margin: 18px 0 6px; font: 600 27px/1.05 'Newsreader', serif; letter-spacing: -.035em; }
    .b-readiness > p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .b-checks { display: grid; gap: 8px; }
    .b-check { display: flex; align-items: flex-start; gap: 10px; border: 1px solid var(--line); border-radius: 13px; padding: 12px; background: color-mix(in srgb, var(--surface-solid) 75%, transparent); }
    .b-check.ok { border-color: color-mix(in srgb, var(--teal) 42%, var(--line)); background: color-mix(in srgb, var(--teal) 8%, transparent); }
    .b-check-icon { flex: 0 0 auto; width: 17px; height: 17px; margin-top: 1px; color: var(--teal); font-weight: 700; }
    .b-check strong { display: block; font-size: 12px; }
    .b-check small { display: block; margin-top: 3px; overflow: hidden; color: var(--muted); font: 10px/1.4 'JetBrains Mono', monospace; text-overflow: ellipsis; white-space: nowrap; }
    .b-library { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 17px; }
    .b-library-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
    .b-library-row { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding: 9px 2px; }
    .b-library-row:last-child { border-bottom: 0; }
    .b-library-row .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
    .b-library-row strong { display: block; font-size: 11.5px; }
    .b-library-row small { display: block; margin-top: 2px; color: var(--dim); font: 9px 'JetBrains Mono', monospace; }
    .b-library-row .version { margin-left: auto; color: var(--dim); font: 9px 'JetBrains Mono', monospace; }
    .b-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
    .b-panel-title { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
    .b-panel-title .mark { color: var(--blue); font-size: 17px; }
    .b-panel-description { margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .b-panel-body { padding: 16px 20px 20px; }
    .search-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
    .search-box input { height: 36px; padding-left: 10px; color: var(--ink); background: var(--paper); }
    .b-search-hint { display: flex; align-items: center; gap: 7px; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .b-search-hint i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
    .catalog-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 20px 20px 16px; border-bottom: 1px solid var(--line); }
    .catalog-result { display: grid; grid-template-columns: 36px minmax(0,1fr) auto; align-items: start; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line); }
    .catalog-result:last-child { border-bottom: 0; }
    .catalog-result:hover { background: color-mix(in srgb, var(--blue-soft) 45%, transparent); }
    .catalog-icon { width: 36px; height: 36px; display: grid; flex: none; place-items: center; border-radius: 10px; color: var(--blue); background: var(--blue-soft); font-size: 16px; }
    .catalog-result h4 { margin: 0 0 4px; font-size: 13.5px; }
    .catalog-result p { margin: 0 0 7px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .catalog-result .meta { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .catalog-result .install { min-width: 76px; flex: none; }
    .b-target { display: grid; grid-template-columns: minmax(0, 1fr) minmax(150px, .7fr); gap: 10px; margin-top: 15px; border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: color-mix(in srgb, var(--surface-solid) 92%, transparent); }
    .b-target label { color: var(--muted); font-size: 10px; font-weight: 700; }
    .b-target input, .b-target select { width: 100%; height: 34px; margin-top: 6px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 9px; outline: 0; color: var(--ink); background: var(--paper); font: 11px 'JetBrains Mono', monospace; }
    .b-target input:focus, .b-target select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
    .b-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
    .b-layout .btn { min-height: 34px; border-radius: 9px; font-weight: 700; }
    .b-home-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 18px; border: 1px solid var(--line-strong); border-radius: 15px; padding: 11px 13px; background: color-mix(in srgb, var(--surface-solid) 90%, transparent); box-shadow: var(--shadow); }
    .b-home-actions__status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .b-home-actions__status i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
    .b-home-actions__buttons { display: flex; gap: 7px; }
    .b-home-actions__buttons .btn { min-height: 34px; border-radius: 9px; font-weight: 700; }
    .b-inventory-panel { min-width: 0; }
    .b-inventory-toolbar { display: flex; align-items: center; gap: 9px; padding: 13px 20px; border-bottom: 1px solid var(--line); }
    .b-local-filter { display: flex; align-items: center; gap: 7px; min-width: 220px; flex: 1; height: 34px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 10px; color: var(--dim); background: var(--paper); }
    .b-local-filter input { min-width: 0; width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
    .b-inventory-toolbar select { height: 34px; border: 1px solid var(--line-strong); border-radius: 9px; padding: 0 9px; color: var(--ink); background: var(--paper); font: 11px 'JetBrains Mono', monospace; }
    .b-installed-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; padding: 15px 20px 20px; }
    .b-installed-card { display: flex; min-height: 176px; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 16px; padding: 15px; background: color-mix(in srgb, var(--surface-solid) 92%, transparent); transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease; }
    .b-installed-card:hover { border-color: color-mix(in srgb, var(--blue) 44%, var(--line)); transform: translateY(-2px); box-shadow: 0 10px 22px color-mix(in srgb, var(--blue) 16%, transparent); }
    .b-installed-card__head { display: flex; align-items: flex-start; gap: 9px; }
    .b-installed-card__glyph { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border-radius: 11px; color: var(--blue); background: var(--blue-soft); font-size: 15px; }
    .b-installed-card h4 { margin: 0 0 3px; font-size: 13.5px; }
    .b-installed-card__path { overflow: hidden; color: var(--muted); font: 9.5px 'JetBrains Mono', monospace; text-overflow: ellipsis; white-space: nowrap; }
    .b-installed-card__status { margin-left: auto; color: var(--teal); font: 9px 'JetBrains Mono', monospace; }
    .b-installed-card p { min-height: 35px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .b-installed-card__footer { display: flex; align-items: center; gap: 7px; margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; }
    .b-installed-card__footer .version { color: var(--dim); font: 9px 'JetBrains Mono', monospace; }
    .b-installed-card__footer .btn { margin-left: auto; }
    .b-installed-card__footer .btn + .btn { margin-left: 0; }
    .b-inventory-empty { padding: 35px 20px; color: var(--muted); text-align: center; font-size: 12px; }
    .b-discover-back { border-color: transparent; color: var(--muted); background: transparent; }

    /* Variant C: a focused file studio, where package editing is the primary job. */
    .c-command { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 13px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .c-command .crumb { margin-right: auto; color: var(--muted); font: 11px 'JetBrains Mono', monospace; }
    .c-command .crumb strong { color: var(--ink); font-weight: 600; }
    .c-studio { display: grid; grid-template-columns: 235px minmax(0,1fr); min-height: 580px; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); box-shadow: var(--small-shadow); }
    .c-sidebar { border-right: 1px solid var(--line); padding: 14px 10px; }
    .c-sidebar .skill-context { margin-bottom: 15px; padding: 0 7px 14px; border-bottom: 1px solid var(--line); }
    .c-sidebar h3 { margin: 0 0 3px; font-size: 15px; }
    .c-sidebar .skill-context p { margin: 0; color: var(--muted); font-size: 10.5px; line-height: 1.45; }
    .file-action { display: flex; gap: 5px; margin: 8px 0 12px; }
    .file-action button { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 6px 2px; color: var(--muted); background: var(--surface-solid); font-size: 10px; }
    .file-action button:hover { color: var(--blue); border-color: var(--blue); }
    .c-files .tree-row { padding-top: 7px; padding-bottom: 7px; }
    .c-editor { min-width: 0; display: flex; flex-direction: column; }
    .file-tabs { display: flex; overflow: auto; gap: 2px; min-height: 43px; padding: 7px 10px 0; border-bottom: 1px solid var(--line); }
    .file-tabs button { border: 1px solid transparent; border-bottom: 0; border-radius: 7px 7px 0 0; padding: 8px 11px; color: var(--muted); background: transparent; font: 10px 'JetBrains Mono', monospace; white-space: nowrap; }
    .file-tabs button.active { color: var(--ink); border-color: var(--line); background: var(--surface-solid); }
    .c-editor-body { flex: 1; padding: 20px 23px; }
    .c-editor-body .edit-banner { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; color: var(--muted); font-size: 11px; }
    .edit-banner i { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); }
    .c-editor-body .markdown { max-width: 680px; }
    .c-footer { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 10.5px; }
    .c-footer span:last-child { margin-left: auto; font-family: 'JetBrains Mono', monospace; }

    .toast { position: fixed; z-index: 5; right: 22px; bottom: 80px; max-width: 320px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 13px; color: var(--ink); background: var(--surface-solid); box-shadow: var(--shadow); font-size: 12px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .switcher { position: fixed; z-index: 6; bottom: 20px; left: 50%; display: flex; align-items: center; gap: 10px; transform: translateX(-50%); border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: 6px 8px; color: #e9f1f6; background: rgba(13, 24, 35, .92); box-shadow: 0 12px 30px rgba(0,0,0,.28); backdrop-filter: blur(14px); }
    .switcher button { display: grid; place-items: center; width: 27px; height: 27px; border: 0; border-radius: 50%; color: #dae8f1; background: rgba(255,255,255,.08); font-size: 16px; }
    .switcher button:hover { background: rgba(132,195,236,.24); }
    .switcher .label { min-width: 172px; text-align: center; font: 10.5px 'JetBrains Mono', monospace; }
    .switcher .label b { color: #9fd4ee; }
    .hint-strip { margin-top: 12px; color: var(--dim); font-size: 10.5px; line-height: 1.45; }

    @media (max-width: 820px) {
      body { padding: 0 0 84px; }
      .prototype-meta { display: none; }
      .app { border: 0; border-radius: 0; }
      .topbar { gap: 10px; padding: 0 14px; }
      .brand span:last-child { display: none; }
      .nav button { padding-inline: 9px; }
      .engine { display: none; }
      .content { padding: 21px 15px 28px; }
      .page-head { flex-direction: column; }
      .actions { justify-content: flex-start; }
      .a-layout, .b-layout, .c-studio { grid-template-columns: 1fr; }
      .b-hero-head { align-items: flex-start; flex-direction: column; padding-top: 24px; }
      .b-hero-aside { justify-items: start; }
      .a-body { grid-template-columns: 1fr; }
      .tree, .c-sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .c-sidebar { padding-bottom: 9px; }
      .c-sidebar .skill-context { display: inline-block; width: 50%; margin-bottom: 4px; border-bottom: 0; }
      .c-files { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 2px; }
      .c-files .section-label { grid-column: 1 / -1; }
      .b-readiness { position: static; }
      .b-target { grid-template-columns: 1fr; }
      .catalog-result { grid-template-columns: 36px minmax(0,1fr); }
      .catalog-result .install { grid-column: 2; justify-self: start; }
      .b-home-actions { align-items: stretch; flex-direction: column; }
      .b-home-actions__buttons { width: 100%; }
      .b-home-actions__buttons .btn { flex: 1; }
      .b-installed-grid { grid-template-columns: 1fr; }
      .switcher .label { min-width: 130px; }
    }
    @media (max-width: 500px) {
      .theme { display: none; }
      h2 { font-size: 25px; }
      .b-hero-head { padding: 22px 0 18px; }
      .search-box { grid-template-columns: 1fr; }
      .b-inventory-toolbar { align-items: stretch; flex-direction: column; }
      .b-local-filter { min-width: 0; }
      .catalog-result { gap: 8px; padding-inline: 15px; }
      .catalog-result .install { margin-left: 0; }
      .switcher { bottom: 11px; }
    }
  </style>
</head>
<body>
  <div class="prototype-meta">
    <h1>Agent Context · Skills 管理 UI 原型</h1>
    <p>PROTOTYPE / no persistence / choose a direction</p>
  </div>
  <main id="app" class="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <nav class="switcher" aria-label="Prototype variants">
    <button id="previous" aria-label="上一个方案">‹</button>
    <div class="label" id="variant-label"></div>
    <button id="next" aria-label="下一个方案">›</button>
  </nav>

  <script>
    const variants = [
      { key: 'A', name: 'Workbench · 维护优先' },
      { key: 'B', name: 'Catalog · 发现优先' },
      { key: 'C', name: 'Studio · 编辑优先' },
    ];
    const localSkills = [
      ['SQL 调试', 'dev / sql-debugging', 'v3', '⌁'],
      ['KQL 分析', 'dev / kql-analysis', 'v2', '◌'],
      ['家电维修', 'home / appliance-repair', 'v1', '⌂'],
      ['Craft Agents 引导', 'dev / craft-agents-guide', 'v1', '✦'],
    ];
    const installedDescriptions = [
      '诊断重复行、聚合异常和查询性能退化。',
      '面向日志与指标的 KQL 查询分析工作流。',
      '家庭设备故障排查、记录与维修步骤。',
      'Agent Context 的连接、上报与 Skill 使用指南。',
    ];
    const catalog = [
      ['find-skills', 'vercel-labs/skills', '帮助代理发现和安装更多 skills 的官方技能。', '24531', 'vercel-labs/skills/find-skills'],
      ['react-best-practices', 'vercel-labs/agent-skills', 'React 与 Next.js 项目中的性能和代码组织建议。', '12840', 'vercel-labs/agent-skills/react-best-practices'],
      ['gh-skill', 'cli/cli', '使用 GitHub CLI 管理、搜索、预览和发布 Agent Skills。', '9280', 'cli/cli/gh-skill'],
    ];
    let toastTimer;
    let bMode = 'library';

    function queryVariant() {
      const key = new URLSearchParams(location.search).get('variant') || 'A';
      return variants.some(v => v.key === key) ? key : 'A';
    }
    function setVariant(key) {
      const url = new URL(location.href);
      url.searchParams.set('variant', key);
      history.replaceState({}, '', url);
      if (key !== 'B') bMode = 'library';
      render();
    }
    function setBMode(mode) {
      bMode = mode;
      render();
    }
    function notify(message) {
      const el = document.getElementById('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }
    function action(message) { return `onclick="notify('${message}')"`; }
    function themeButtons() {
      return `<div class="theme"><button class="active" onclick="setTheme('light')">日</button><button onclick="setTheme('dark')">夜</button></div>`;
    }
    function setTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.querySelectorAll('.theme button').forEach(button => button.classList.toggle('active', button.textContent === (theme === 'dark' ? '夜' : '日')));
    }
    function topbar() {
      return `<header class="topbar">
        <div class="brand"><span class="brand-mark">AC</span><span>Agent Context</span></div>
        <nav class="nav"><button>知识</button><button class="active">Skills</button><button>分析</button><button>健康</button><button>设置</button></nav>
        <div class="engine"><i></i> 引擎在线 · 队列 0</div>${themeButtons()}
      </header>`;
    }
    function pageHead(kicker, title, lead, actions) {
      return `<div class="page-head"><div><p class="eyebrow">${kicker}</p><h2>${title}</h2><p class="lead">${lead}</p></div><div class="actions">${actions}</div></div>`;
    }
    function localRail() {
      return `<section class="surface"><div class="rail-head"><span class="section-label">我的 Skills</span><span class="tag blue">12</span></div><div class="rail-list">${localSkills.map(skill => `<div class="rail-item"><span class="dot"></span><div><strong>${skill[0]}</strong><small>${skill[1]}</small></div><span class="version">${skill[2]}</span></div>`).join('')}</div><div class="install-note">远程安装只会下载 package 文件并写入平台目录，不会执行其中的脚本。</div></section>`;
    }
    function tree(active = 'SKILL.md') {
      const rows = [
        `<button class="tree-row ${active === 'SKILL.md' ? 'active' : ''}"><span>▣</span> SKILL.md</button>`,
        `<button class="tree-row folder"><span>⌄</span> scripts/</button>`,
        `<div class="tree-indent"><button class="tree-row ${active === 'scripts/trace.ts' ? 'active' : ''}"><span>·</span> trace.ts</button><button class="tree-row ${active === 'scripts/check.sh' ? 'active' : ''}"><span>·</span> check.sh</button></div>`,
        `<button class="tree-row folder"><span>⌄</span> references/</button>`,
        `<div class="tree-indent"><button class="tree-row"><span>·</span> patterns.md</button></div>`,
        `<button class="tree-row"><span>◇</span> assets/query-flow.svg</button>`,
      ];
      return rows.join('');
    }
    function markdown(edit = false) {
      if (edit) return `<div class="edit-banner"><i></i> 未保存更改 · 这是原型中的编辑状态</div><textarea class="field" style="width:100%;min-height:320px;border:1px solid var(--line-strong);border-radius:9px;padding:13px;color:var(--code-ink);background:var(--code);font:11px/1.65 'JetBrains Mono',monospace">---\nname: SQL 调试\ndescription: 诊断数据查询问题\n---\n\n# SQL 调试\n\n当查询存在重复行、聚合异常或性能退化时加载。\n\n## 工作流\n1. 先复现并记录最小查询。\n2. 检查关联边界与执行计划。\n3. 输出可复用的诊断结论。</textarea>`;
      return `<article class="markdown"><h4>SQL 调试</h4><p>用于诊断数据查询问题的技能包。当查询返回重复事件、聚合异常或性能退化时加载。</p><div class="note"><b>触发条件：</b>结果存在重复行 / 需要关联两个以上数据源 / 聚合结果可疑</div><h5>工作流</h5><p>先建立最小可复现查询，再检查关联边界、过滤顺序和执行计划，最后输出可以被其他代理复用的诊断结论。</p><pre class="code">const diagnosis = await traceQuery({\n  query,\n  includePlan: true,\n  sampleRows: 20,\n});</pre></article>`;
    }

    function variantA() {
      return `<div>${topbar()}<div class="content">
        ${pageHead('SKILLS / WORKBENCH', '能力包工作台', '在一个地方发现、导入、创建并维护可复用的 Skill package。当前视图把“我的技能”和“文件内容”放在同一条工作流里。', `<button class="btn" ${action('原型：打开 ZIP 上传向导')}>⇧ 上传 ZIP</button><button class="btn primary" ${action('原型：打开新建 Skill 表单')}>＋ 新建 Skill</button>`)}
        <div class="a-layout">
          <section class="surface">
            <div class="inventory-head"><span class="section-label">我的技能</span><span class="tiny">按最近更新</span></div>
            <div class="inventory-tabs"><button class="active">全部</button><button>dev</button><button>home</button></div>
            <div class="skill-list">${localSkills.map((skill, index) => `<button class="skill-row ${index === 0 ? 'active' : ''}" ${action(`原型：切换到 ${skill[0]}`)}><span class="skill-glyph">${skill[3]}</span><span style="min-width:0"><strong>${skill[0]}</strong><small>${skill[1]}</small></span><span class="version">${skill[2]}</span></button>`).join('')}</div>
            <div style="padding:12px 14px;border-top:1px solid var(--line)"><button class="btn small" style="width:100%" ${action('原型：进入 skills.sh 发现页')}>⌕ 从 skills.sh 发现</button></div>
          </section>
          <section class="surface">
            <div class="detail-head"><div><h3>SQL 调试</h3><span class="tiny mono">dev / sql-debugging · 最近发布 v3</span></div><div class="tags"><span class="tag blue">dev</span><span class="tag">v3</span></div></div>
            <div class="detail-toolbar"><button class="btn small" ${action('原型：进入编辑并发布')}>✎ 编辑并发布</button><button class="btn small" ${action('原型：打开 ZIP 导入')}>▣ 导入到此 Skill</button><button class="btn small" ${action('原型：确认删除')}>⌫ 删除</button><span style="margin-left:auto" class="tiny">6 files · package ready</span></div>
            <div class="a-body"><aside class="tree"><div class="tree-head"><span class="section-label">PACKAGE TREE</span><span class="tiny">＋ ⌁</span></div>${tree()}</aside><div class="editor"><div class="editor-head"><span class="path">SKILL.md</span><div class="actions"><button class="btn small" ${action('原型：切换到编辑态')}>编辑</button><button class="btn small" ${action('原型：新建文件')}>＋ 文件</button><button class="btn small" ${action('原型：新建文件夹')}>＋ 文件夹</button></div></div>${markdown()}<p class="hint-strip">A 的重点：延续当前 UI 的熟悉布局，顶部动作直接暴露三条入口，适合日常维护频率高的用户。</p></div></div>
          </section>
        </div>
      </div></div>`;
    }

    function catalogResult(skill) {
      return `<article class="catalog-result"><div class="catalog-icon">✦</div><div style="min-width:0;flex:1"><h4>${skill[0]}</h4><p>${skill[2]}</p><div class="meta"><span class="tag blue">${skill[1]}</span><span class="tag">↓ ${skill[3]} installs</span><a class="tag" href="https://skills.sh/${skill[4]}" target="_blank" rel="noreferrer">skills.sh ↗</a></div></div><button class="btn primary small install" ${action(`原型：安装 ${skill[0]} 到 dev`) }>安装到 dev</button></article>`;
    }
    function installedCard(skill, index) {
      return `<article class="b-installed-card"><div class="b-installed-card__head"><span class="b-installed-card__glyph">${skill[3]}</span><div style="min-width:0"><h4>${skill[0]}</h4><div class="b-installed-card__path">${skill[1]}</div></div><span class="b-installed-card__status">● INSTALLED</span></div><p>${installedDescriptions[index]}</p><div class="b-installed-card__footer"><span class="tag blue">package</span><span class="version">${skill[2]} · 6 files</span><button class="btn small" ${action(`原型：打开 ${skill[0]}`)}>打开</button></div></article>`;
    }
    function variantBLibrary() {
      return `<div>${topbar()}<div class="content">
        <section class="b-hero-head"><div class="b-hero-copy"><p class="eyebrow">SKILLS / LIBRARY</p><h2>我的 Skills</h2><p class="lead">已安装的能力包都集中在这里。需要扩展能力时，再进入 skills.sh 目录发现并安装新的 Skill。</p></div><div class="b-hero-aside"><span class="b-badge"><i></i>本地库在线</span><span class="b-status">12 installed · Workspace</span></div></section>
        <div class="b-home-actions"><div class="b-home-actions__status"><i></i>当前显示全部已安装 Skills · 按最近更新排序</div><div class="b-home-actions__buttons"><button class="btn" ${action('原型：打开 ZIP 上传')}>⇧ 上传 ZIP</button><button class="btn" ${action('原型：打开手动创建')}>＋ 新建 Skill</button><button class="btn primary" onclick="setBMode('discover')">✦ 发现 Skills</button></div></div>
        <section class="b-panel b-inventory-panel"><div class="b-panel-head"><div><div class="b-panel-title"><span class="mark">▦</span>已安装 Skills</div><p class="b-panel-description">每个 Skill 都保留 Domain、版本和 package 文件状态。</p></div><span class="b-status">12 packages</span></div><div class="b-inventory-toolbar"><label class="b-local-filter"><span>⌕</span><input aria-label="筛选已安装 Skills" placeholder="筛选已安装 Skills" /></label><select aria-label="按 Domain 筛选"><option>全部 Domain</option><option>dev</option><option>home</option></select><span class="tiny">最近更新 ↓</span></div><div class="b-installed-grid">${localSkills.map(installedCard).join('')}</div></section>
        <p class="hint-strip">B 的默认状态：打开 Skills 页面先看到自己的能力库；“发现 Skills”是明确的扩展入口，进入后再搜索 skills.sh。</p>
      </div></div>`;
    }
    function variantBDiscover() {
      return `<div>${topbar()}<div class="content">
        <section class="b-hero-head"><div class="b-hero-copy"><p class="eyebrow">SKILLS / DISCOVER</p><h2>发现下一项能力</h2><p class="lead">先搜索公开目录，再把你确认过的 Skill package 安装到指定 Domain。这个方向把“发现”放在 Skills 页的第一屏。</p></div><div class="b-hero-aside"><button class="btn b-discover-back" onclick="setBMode('library')">← 我的 Skills</button><span class="b-badge"><i></i>目录在线</span><span class="b-status">skills.sh · 只读目录</span></div></section>
        <div class="b-flow" aria-label="安装流程"><button class="b-flow-step active"><span>1</span>搜索目录</button><i class="b-flow-separator">/</i><button class="b-flow-step"><span>2</span>预览来源</button><i class="b-flow-separator">/</i><button class="b-flow-step"><span>3</span>安装到 Domain</button></div>
        <div class="b-layout"><aside class="b-readiness"><div class="b-readiness-icon">⌕</div><h3>安装前，先看清来源</h3><p>公开目录只负责发现。安装前保留来源、文件清单和目标 Domain，让每次导入都有可追溯的上下文。</p><div class="b-checks"><div class="b-check ok"><span class="b-check-icon">✓</span><div><strong>来源可追溯</strong><small>vercel-labs/skills</small></div></div><div class="b-check ok"><span class="b-check-icon">✓</span><div><strong>Package 文件可预览</strong><small>SKILL.md · scripts/ · references/</small></div></div><div class="b-check ok"><span class="b-check-icon">✓</span><div><strong>不会执行远程脚本</strong><small>只下载并写入平台 Skills 目录</small></div></div></div><div class="b-library"><div class="b-library-head"><span class="section-label">我的 Skills</span><span class="tag blue">12</span></div>${localSkills.slice(0, 3).map(skill => `<div class="b-library-row"><span class="dot"></span><div><strong>${skill[0]}</strong><small>${skill[1]}</small></div><span class="version">${skill[2]}</span></div>`).join('')}</div><div class="b-actions"><button class="btn" ${action('原型：打开手动创建')}>＋ 手动创建</button><button class="btn" ${action('原型：打开 ZIP 上传')}>⇧ 上传 ZIP</button></div></aside><div class="b-stack"><section class="b-panel"><div class="b-panel-head"><div><div class="b-panel-title"><span class="mark">⌕</span>搜索 skills.sh</div><p class="b-panel-description">按名称、来源或描述搜索公开 Skill。搜索结果只展示目录信息，不会自动安装。</p></div><span class="b-status">semantic search</span></div><div class="b-panel-body"><div class="search-box"><input value="react performance" aria-label="搜索 skills.sh"/><button class="btn primary" ${action('原型：搜索 skills.sh')}>搜索目录</button></div><div class="b-search-hint"><i></i>建议使用 2 个以上关键词，例如 “react performance”</div><div class="b-target"><div><label for="target-domain">安装到 Domain</label><input id="target-domain" value="dev" /></div><div><label for="target-slug">本地 slug</label><input id="target-slug" value="react-performance" /></div></div></div></section><section class="b-panel"><div class="catalog-head"><div><div class="b-panel-title"><span class="mark">✦</span>搜索结果</div><p class="b-panel-description">3 个结果 · 按相关性排序</p></div><span class="b-status">目录已同步</span></div>${catalog.map(catalogResult).join('')}</section></div></div>
        <p class="hint-strip">B 的重点：保留“发现优先”，但用 Setup 的三步流程和 Settings 的状态面板让搜索、预览、安装边界更清楚。</p>
      </div></div>`;
    }
    function variantB() {
      return bMode === 'discover' ? variantBDiscover() : variantBLibrary();
    }

    function variantC() {
      return `<div>${topbar()}<div class="content">
        ${pageHead('SKILLS / STUDIO', 'Skill Studio', '进入一个 package 后，文件树、编辑器和版本动作成为主角；发现与导入收进命令栏，减少对内容工作的干扰。', `<button class="btn" ${action('原型：返回我的 Skills')}>← 我的 Skills</button>`)}
        <div class="c-command"><span class="crumb"><strong>dev / sql-debugging</strong> <span>· v3 · 6 files</span></span><button class="btn small" ${action('原型：添加文件')}>＋ 文件</button><button class="btn small" ${action('原型：添加文件夹')}>＋ 文件夹</button><button class="btn small" ${action('原型：选择 ZIP')}>⇧ 导入 ZIP</button><button class="btn amber small" ${action('原型：发布新版本')}>发布 v4</button></div>

    function render() {
      const key = queryVariant();
      document.getElementById('app').innerHTML = key === 'A' ? variantA() : key === 'B' ? variantB() : variantC();
      const current = variants.find(v => v.key === key);
      document.getElementById('variant-label').innerHTML = `<b>${current.key}</b> — ${current.name}`;
    }
    function cycle(direction) {
      const index = variants.findIndex(v => v.key === queryVariant());
      setVariant(variants[(index + direction + variants.length) % variants.length].key);
    }
    document.getElementById('previous').addEventListener('click', () => cycle(-1));
    document.getElementById('next').addEventListener('click', () => cycle(1));
    document.addEventListener('keydown', event => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName) || document.activeElement?.isContentEditable) return;
      if (event.key === 'ArrowLeft') cycle(-1);
      if (event.key === 'ArrowRight') cycle(1);
    });
    render();
  </script>
