<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Context · Knowledge Library Prototype</title>
  <!-- PROTOTYPE: 三种知识库左右双栏方案，统一通过 ?variant=A|B|C 预览。 -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

    :root {
      --paper: #eef3f7;
      --paper-deep: #e5ecf2;
      --card: rgba(255, 255, 255, .82);
      --card-solid: #ffffff;
      --card-soft: rgba(238, 244, 248, .88);
      --ink: #1d2c3a;
      --muted: #6b7b89;
      --faint: #93a1ad;
      --line: rgba(53, 82, 103, .14);
      --line-strong: rgba(53, 82, 103, .24);
      --blue: #2f6fc8;
      --blue-soft: rgba(47, 111, 200, .11);
      --amber: #c77b35;
      --amber-soft: rgba(199, 123, 53, .13);
      --green: #3d8a6b;
      --green-soft: rgba(61, 138, 107, .12);
      --red: #bd5c58;
      --red-soft: rgba(189, 92, 88, .12);
      --shadow: 0 24px 70px rgba(40, 65, 86, .12);
      --shadow-soft: 0 8px 25px rgba(40, 65, 86, .07);
      --radius: 17px;
    }

    [data-theme="dark"] {
      --paper: #15212b;
      --paper-deep: #101a22;
      --card: rgba(25, 39, 51, .88);
      --card-solid: #1a2a37;
      --card-soft: rgba(20, 34, 45, .84);
      --ink: #e6eef4;
      --muted: #9aabb8;
      --faint: #6e8291;
      --line: rgba(180, 211, 231, .13);
      --line-strong: rgba(180, 211, 231, .24);
      --blue: #84c3ec;
      --blue-soft: rgba(132, 195, 236, .13);
      --amber: #e1a269;
      --amber-soft: rgba(225, 162, 105, .14);
      --green: #7cc7a7;
      --green-soft: rgba(124, 199, 167, .13);
      --red: #e28782;
      --red-soft: rgba(226, 135, 130, .13);
      --shadow: 0 24px 70px rgba(0, 0, 0, .22);
      --shadow-soft: 0 8px 25px rgba(0, 0, 0, .18);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 83% 4%, rgba(132, 195, 236, .17), transparent 27rem),
        linear-gradient(180deg, var(--paper-deep), var(--paper) 20rem);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      transition: background .2s ease, color .2s ease;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 100% 5px;
      mix-blend-mode: soft-light;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .app-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 26px;
      min-height: 68px;
      padding: 12px clamp(18px, 4vw, 54px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--paper) 83%, transparent);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 178px; }
    .brand-mark {
      display: grid; place-items: center; width: 31px; height: 31px;
      border-radius: 12px 16px 12px 16px; color: white; font-weight: 700;
      background: linear-gradient(145deg, var(--blue), var(--amber));
      transform: rotate(-5deg); box-shadow: 0 5px 14px rgba(47,111,200,.25);
    }
    .brand-name { font: 600 17px/1 'Newsreader', serif; letter-spacing: -.02em; }
    .brand-sub { margin-top: 4px; color: var(--muted); font: 9px/1 'DM Mono', monospace; letter-spacing: .13em; }
    .top-nav { display: flex; align-items: center; gap: 5px; flex: 1; overflow-x: auto; }
    .top-nav a {
      padding: 8px 12px; color: var(--muted); text-decoration: none; white-space: nowrap;
      border-radius: 99px; font-size: 12px; font-weight: 600;
    }
    .top-nav a.active { color: white; background: var(--blue); box-shadow: 0 5px 14px rgba(47,111,200,.2); }
    .header-side { display: flex; align-items: center; gap: 9px; }
    .engine-pill, .theme-toggle {
      display: flex; align-items: center; gap: 7px; padding: 7px 10px;
      border: 1px solid var(--line); border-radius: 99px; color: var(--muted);
      background: var(--card-soft); font-size: 10px; white-space: nowrap;
    }
    .engine-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
    .theme-toggle { cursor: pointer; }
    .page { width: min(1500px, calc(100% - 40px)); margin: 0 auto; padding: 42px 0 112px; }
    .page-title-row { display: flex; align-items: start; justify-content: space-between; gap: 22px; margin-bottom: 25px; }
    .eyebrow { color: var(--blue); font: 500 10px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 6px; font: 600 clamp(31px, 4vw, 48px)/.95 'Newsreader', serif; letter-spacing: -.04em; }
    .lede { max-width: 600px; margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .split { display: grid; grid-template-columns: minmax(330px, 37%) minmax(0, 1fr); min-height: 690px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); overflow: hidden; }
    .left-pane { min-width: 0; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--card-soft) 88%, transparent); }
    .right-pane { min-width: 0; background: color-mix(in srgb, var(--card) 92%, transparent); }
    .pane-head { padding: 20px 21px 15px; border-bottom: 1px solid var(--line); }
    .pane-head-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pane-title { font-size: 13px; font-weight: 700; }
    .search-box { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 11px; color: var(--muted); background: var(--card-solid); }
    .search-box svg { width: 15px; flex: 0 0 auto; }
    .search-box input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; }
    .search-box input::placeholder { color: var(--faint); }
    .status-tabs { display: flex; gap: 5px; padding: 13px 21px 11px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .status-tab { border: 0; border-radius: 99px; padding: 7px 10px; color: var(--muted); background: transparent; cursor: pointer; white-space: nowrap; font-size: 11px; }
    .status-tab:hover { background: var(--blue-soft); }
    .status-tab.active { color: var(--blue); background: var(--blue-soft); font-weight: 700; }
    .count { display: inline-grid; place-items: center; min-width: 19px; height: 19px; margin-left: 3px; padding: 0 5px; border-radius: 99px; color: var(--muted); background: var(--paper-deep); font: 10px 'DM Mono', monospace; }
    .status-tab.active .count { color: var(--blue); background: color-mix(in srgb, var(--blue) 18%, transparent); }
    .list { padding: 9px; }
    .item {
      display: block; width: 100%; padding: 15px 13px; border: 1px solid transparent; border-radius: 13px;
      text-align: left; color: inherit; background: transparent; cursor: pointer; transition: .15s ease;
    }
    .item + .item { margin-top: 3px; }
    .item:hover { background: var(--blue-soft); }
    .item.selected { border-color: color-mix(in srgb, var(--blue) 38%, var(--line)); background: var(--card-solid); box-shadow: var(--shadow-soft); }
    .item-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .item-title { font-size: 12px; font-weight: 700; line-height: 1.35; }
    .item-content { display: -webkit-box; overflow: hidden; margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .item-foot { display: flex; align-items: center; gap: 7px; margin-top: 11px; color: var(--faint); font: 9px 'DM Mono', monospace; }
    .confidence { flex: 1; height: 4px; max-width: 65px; overflow: hidden; border-radius: 99px; background: var(--paper-deep); }
    .confidence i { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
    .tag { display: inline-flex; align-items: center; padding: 4px 7px; border-radius: 99px; color: var(--muted); background: var(--paper-deep); font: 9px 'DM Mono', monospace; white-space: nowrap; }
    .tag.blue { color: var(--blue); background: var(--blue-soft); }
    .tag.amber { color: var(--amber); background: var(--amber-soft); }
    .tag.green { color: var(--green); background: var(--green-soft); }
    .tag.red { color: var(--red); background: var(--red-soft); }
    .detail { padding: clamp(23px, 4vw, 51px); }
    .detail-top { display: flex; align-items: start; justify-content: space-between; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .detail-kicker { color: var(--muted); font: 10px 'DM Mono', monospace; }
    .detail h2 { margin-top: 9px; font: 600 clamp(25px, 3vw, 37px)/1.05 'Newsreader', serif; letter-spacing: -.03em; }
    .detail-actions { display: flex; gap: 7px; }
    .icon-button, .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); background: var(--card-solid); cursor: pointer; font-size: 10px; font-weight: 600; }
    .icon-button:hover, .button:hover { border-color: var(--line-strong); color: var(--ink); transform: translateY(-1px); }
    .button.primary { border-color: var(--blue); color: white; background: var(--blue); }
    .button.warning { color: var(--amber); background: var(--amber-soft); border-color: transparent; }
    .button.danger { color: var(--red); background: var(--red-soft); border-color: transparent; }
    .button svg, .icon-button svg { width: 14px; height: 14px; }
    .detail-body { max-width: 760px; padding-top: 28px; }
    .detail-body p { color: var(--muted); font-size: 13px; line-height: 1.85; }
    .callout { margin: 24px 0; padding: 16px 17px; border-left: 3px solid var(--amber); border-radius: 0 12px 12px 0; color: var(--ink); background: var(--amber-soft); font-size: 12px; line-height: 1.7; }
    .callout strong { color: var(--amber); }
    .detail-section { margin-top: 29px; }
    .section-label { margin-bottom: 10px; color: var(--muted); font: 10px 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    .meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--line); }
    .meta-cell { padding: 13px 14px; background: var(--card-soft); }
    .meta-cell label { display: block; color: var(--faint); font: 9px 'DM Mono', monospace; }
    .meta-cell strong { display: block; margin-top: 6px; color: var(--ink); font-size: 11px; font-weight: 600; }
    .detail-footer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
    .notice { position: fixed; right: 24px; bottom: 84px; z-index: 8; max-width: 330px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 11px; color: var(--ink); background: var(--card-solid); box-shadow: var(--shadow-soft); font-size: 11px; }
    .empty { padding: 32px 20px; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.7; }

    /* Variant A refinement: a calmer library list and a more useful inspector. */
    .variant-a.split { grid-template-columns: minmax(320px, 34%) minmax(0, 1fr); }
    .variant-a .left-pane { background: color-mix(in srgb, var(--card-soft) 94%, transparent); }
      .variant-a .pane-head { padding: 19px 20px 14px; border-bottom: 0; }
      .variant-a .status-tabs { padding: 11px 20px; border-bottom: 0; }
      .a-confidence-note { display: flex; align-items: start; gap: 8px; margin: 10px 20px 0; padding: 8px 10px; border: 0; border-radius: 9px; color: var(--muted); background: var(--blue-soft); font-size: 9.5px; line-height: 1.5; }
    .a-confidence-note strong { color: var(--ink); font-weight: 700; }
    .a-confidence-info { display: grid; place-items: center; width: 15px; height: 15px; flex: 0 0 auto; border-radius: 50%; color: var(--blue); background: var(--blue-soft); font: 600 10px 'Newsreader', serif; }
    .variant-a .list { display: grid; gap: 9px; padding: 12px 20px 25px; }
    .variant-a .item { padding: 14px 13px 13px 15px; border: 1px solid var(--line); border-left: 3px solid transparent; background: var(--card-solid); box-shadow: var(--shadow-soft); }
    .variant-a .item + .item { margin-top: 0; }
    .variant-a .item:hover { border-color: color-mix(in srgb, var(--blue) 32%, var(--line)); background: var(--card-solid); }
    .variant-a .item.selected { border-left-color: var(--blue); }
    .variant-a .item-top { align-items: start; }
    .variant-a .item-title-wrap { min-width: 0; display: flex; flex-direction: column; align-items: start; gap: 7px; }
    .variant-a .item-title { font-size: 12px; line-height: 1.4; }
    .variant-a .item-kind { display: flex; }
    .variant-a .item-confidence-value { flex: 0 0 auto; padding: 4px 6px; border-radius: 7px; color: var(--blue); background: var(--blue-soft); font: 9px 'DM Mono', monospace; white-space: nowrap; }
    .variant-a .item-confidence-value.low { color: var(--amber); background: var(--amber-soft); }
    .variant-a .item-content { margin-top: 10px; -webkit-line-clamp: 2; }
    .variant-a .item-foot { margin-top: 12px; }
    .variant-a .item-domain { color: var(--ink); font-weight: 500; }
    .variant-a .item-updated { color: var(--faint); }
    .variant-a .confidence { display: none; }
    .detail-a { min-height: 690px; }
    .detail-top-a { align-items: center; }
    .detail-tools-a { display: flex; align-items: center; gap: 7px; }
    .detail-position { margin-right: 2px; color: var(--faint); font: 9px 'DM Mono', monospace; white-space: nowrap; }
    .detail-body.detail-a { max-width: 820px; }
    .detail-body.detail-a > p { max-width: 720px; color: var(--ink); font-size: 15px; line-height: 1.8; }
    .detail-body.detail-a .detail-section { max-width: 820px; }
    .detail-body.detail-a .detail-footer { position: sticky; bottom: 0; z-index: 2; margin-right: -1px; padding: 17px 0 3px; background: linear-gradient(180deg, color-mix(in srgb, var(--card) 0%, transparent), var(--card) 25%); backdrop-filter: blur(8px); }
    .detail-body.detail-a .detail-footer::before { content: '操作'; align-self: center; margin-right: 4px; color: var(--faint); font: 9px 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    .detail-body.detail-a .button { min-height: 36px; }
    .detail-body.detail-a .button.primary { padding-inline: 16px; }

    /* Variant B: compact inbox hierarchy. */
    .variant-b.split { grid-template-columns: minmax(310px, 42%) minmax(0, 1fr); }
    .variant-b .left-pane { background: var(--card-solid); }
    .variant-b .pane-head { padding-bottom: 20px; }
    .variant-b .status-tabs { padding-top: 16px; padding-bottom: 15px; }
    .variant-b .status-tab { flex: 1; padding: 11px 7px; border: 1px solid var(--line); border-radius: 10px; }
    .variant-b .status-tab.active { border-color: color-mix(in srgb, var(--blue) 35%, var(--line)); }
    .variant-b .item { padding: 14px 13px; border-left: 3px solid transparent; border-radius: 9px; }
    .variant-b .item.selected { border-top-color: var(--line); border-right-color: var(--line); border-bottom-color: var(--line); border-left-color: var(--blue); }
    .variant-b .right-pane { background: transparent; }
    .variant-b .detail { padding: 0; }
    .inspector-banner { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px 25px; border-bottom: 1px solid var(--line); background: var(--card-soft); }
    .inspector-banner p { color: var(--muted); font-size: 11px; }
    .inspector-main { padding: clamp(25px, 5vw, 60px); }
    .review-checklist { display: grid; gap: 8px; margin-top: 20px; }
    .check-row { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-soft); color: var(--muted); font-size: 11px; }
    .check-row .check { display: grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; color: white; background: var(--green); font-size: 11px; }
    .check-row.pending .check { color: var(--amber); background: var(--amber-soft); }
    .variant-b .detail-footer { padding-top: 25px; }

    /* Variant C: notebook / archival hierarchy. */
    .variant-c.split { grid-template-columns: minmax(350px, 46%) minmax(0, 1fr); }
    .variant-c .left-pane { padding: 22px; background: transparent; }
    .variant-c .pane-head { padding: 0 0 15px; border: 0; }
    .variant-c .status-tabs { padding: 0 0 18px; border: 0; }
    .variant-c .status-tab { padding: 8px 11px; border: 1px solid var(--line); }
    .variant-c .status-tab.active { border-color: var(--blue); }
    .variant-c .list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; padding: 0; }
    .variant-c .item { min-height: 170px; padding: 15px; border: 1px solid var(--line); background: var(--card-soft); }
    .variant-c .item + .item { margin-top: 0; }
    .variant-c .item.selected { border-color: var(--blue); background: var(--card-solid); box-shadow: var(--shadow-soft); }
    .variant-c .item-content { -webkit-line-clamp: 4; }
    .variant-c .item-foot { flex-wrap: wrap; }
    .variant-c .right-pane { border-left: 1px solid var(--line); }
    .variant-c .detail { padding: 0; }
    .notebook-head { padding: 20px 27px; border-bottom: 1px solid var(--line); background: var(--card-soft); }
    .notebook-head .detail-kicker { color: var(--amber); }
    .notebook-body { padding: clamp(25px, 4vw, 52px); }
    .source-trace { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 25px; }
    .trace-card { padding: 15px; border: 1px dashed var(--line-strong); border-radius: 12px; }
    .trace-card small { color: var(--faint); font: 9px 'DM Mono', monospace; }
    .trace-card strong { display: block; margin-top: 7px; font-size: 11px; line-height: 1.45; }
    .variant-c .detail-footer { margin-top: 25px; }

    .prototype-switcher {
      position: fixed; left: 50%; bottom: 19px; z-index: 10; transform: translateX(-50%);
      display: flex; align-items: center; gap: 11px; padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.2); border-radius: 99px; color: white;
      background: #1c2b38; box-shadow: 0 12px 30px rgba(17,31,42,.28); font-size: 10px;
    }
    .prototype-switcher button { display: grid; place-items: center; width: 25px; height: 25px; border: 0; border-radius: 50%; color: white; background: rgba(255,255,255,.13); cursor: pointer; }
    .prototype-switcher button:hover { background: var(--blue); }
    .prototype-switcher strong { font-weight: 600; }
    .prototype-switcher span { color: #9fb0bc; }

    @media (max-width: 900px) {
      .app-header { gap: 12px; }
      .brand { min-width: auto; }
      .brand-name, .brand-sub, .engine-pill { display: none; }
      .page { width: min(100% - 24px, 700px); padding-top: 28px; }
      .page-title-row { align-items: start; flex-direction: column; }
      .split, .variant-b.split, .variant-c.split { grid-template-columns: 1fr; }
      .left-pane, .variant-c .right-pane { border: 0; }
      .right-pane { border-top: 1px solid var(--line); }
      .variant-c .list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .top-nav a { padding-inline: 8px; font-size: 11px; }
      .header-side { display: none; }
      .page { width: calc(100% - 16px); }
      .meta-grid, .source-trace { grid-template-columns: 1fr; }
      .variant-c .list { grid-template-columns: 1fr; }
      .detail-actions { flex-wrap: wrap; justify-content: end; }
      .detail { padding: 24px 19px; }
    }
  </style>
</head>
<body data-theme="light">
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div><div class="brand-name">Agent Context</div><div class="brand-sub">CONTEXT LAYER</div></div>
    </div>
    <nav class="top-nav" aria-label="主导航">
      <a class="active" href="#">知识库</a><a href="#">技能</a><a href="#">分析</a><a href="#">引擎</a><a href="#">设置</a>
    </nav>
    <div class="header-side">
      <div class="engine-pill"><i class="engine-dot"></i>引擎在线</div>
      <button class="theme-toggle" type="button" data-theme-toggle>☼ <span>主题</span></button>
    </div>
  </header>

  <main class="page">
    <div class="page-title-row">
      <div>
        <div class="eyebrow">Workspace · Personal</div>
        <h1>知识库</h1>
        <p class="lede">集中浏览、复查和维护由 Learning Engine 提炼的可复用知识。状态变化都在同一个工作区内完成。</p>
      </div>
    </div>
    <div id="prototype-root"></div>
  </main>

  <div class="prototype-switcher" aria-label="原型方案切换">
    <button type="button" data-switch="prev" aria-label="上一个方案">‹</button>
    <div><strong data-variant-label>A · 工作台</strong><span>　原型预览</span></div>
    <button type="button" data-switch="next" aria-label="下一个方案">›</button>
  </div>

  <script>
    const items = [
      { id: 'k1', status: 'active', type: 'Solution', title: '从 Host 输出目录启动可避免 SPA 路由 404', content: '运行编译后的 AgentContext.Host.dll 时，应从 src/AgentContext.Host/bin/Debug/net10.0 启动，而不是从仓库根目录启动。', domain: 'dev', source: 'Portal runtime verification', confidence: 0.92, updated: '今天', note: '这是一个与部署方式相关的运行时约束。它解释了为什么同一份编译产物在两个工作目录下会呈现不同的 SPA 路由行为。' },
      { id: 'k2', status: 'active', type: 'Pattern', title: '前端和 .NET 静态资源构建需要顺序执行', content: '先生成 Vite 输出，再让 .NET StaticWebAssets 消费它；只做 backend build 可能留下旧 hash。', domain: 'dev', source: 'Build validation', confidence: 0.86, updated: '昨天', note: '把 frontend build 作为资源生产步骤，把 backend build 作为消费步骤，可以减少静态资源 hash 不一致。' },
      { id: 'k3', status: 'active', type: 'Solution', title: 'Dashboard 使用同源 /monitor 路径', content: 'DASHBOARD_URL 应保持相对路径，YARP 使用精确的 / 路径转发到 Aspire Dashboard。', domain: 'dev', source: 'Single-origin dashboard', confidence: 0.78, updated: '3 天前', note: '同源路径让 Portal、API 和 Dashboard 在 Docker Compose 中保持单一公共入口。' },
      { id: 'k4', status: 'active', type: 'Pattern', title: 'API 错误需要稳定 errorCode 与本地化 message', content: '前端展示 message，程序判断 errorCode；不要依赖本地化后的文本做分支逻辑。', domain: 'platform', source: 'Localization review', confidence: 0.71, updated: '5 天前', note: '稳定的错误代码是跨语言、跨客户端保持行为一致的边界。' },
      { id: 'k5', status: 'review', type: 'Solution', title: 'Settings 表单可能被重复加载覆盖未保存编辑', content: '多个异步 load 请求同时回写状态时，用户正在编辑的 provider draft 可能被旧响应覆盖。', domain: 'dev', source: 'Frontend re-review', confidence: 0.44, updated: '2 天前', note: '该条目进入待复查：原始观察是有效的，但需要结合当前实现确认是否仍然存在。' },
      { id: 'k6', status: 'review', type: 'Pattern', title: '轮询任务应避免重叠执行', content: '使用 setInterval 时，如果一次请求超过间隔，可能出现多个并发 polling；优先使用可等待的循环。', domain: 'dev', source: 'Frontend re-review', confidence: 0.37, updated: '6 天前', note: '该条目需要人工确认适用范围，并决定是否升级为共享的 polling 工具约定。' },
      { id: 'k7', status: 'archived', type: 'Solution', title: '旧版单一 LLM endpoint 配置', content: '历史架构曾把 Chat 和 Embedding 绑定到同一 endpoint，已由独立 inference routes 取代。', domain: 'platform', source: 'ADR 0009', confidence: 0.28, updated: '18 天前', note: '已归档：它仍然可以作为历史背景查看，但不应参与当前检索。' },
      { id: 'k8', status: 'archived', type: 'Pattern', title: '早期 Field Notes 侧栏导航方案', content: '曾使用左侧编号导航，后续产品方向切换为 Botanical 顶部导航。', domain: 'design', source: 'T12 UI exploration', confidence: 0.22, updated: '24 天前', note: '已归档：保留设计演化轨迹，不再作为当前页面结构依据。' }
    ];
    const variantNames = { A: '工作台', B: '复查收件箱', C: '知识档案' };
    const variantKeys = ['A', 'B', 'C'];
    const state = { variant: new URLSearchParams(location.search).get('variant')?.toUpperCase() || 'A', status: 'active', selected: 'k1', search: '', notice: '' };
    if (!variantKeys.includes(state.variant)) state.variant = 'A';

    const icon = (name) => ({ search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>', check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"></path></svg>', archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M5 6v14h14V6M8 6l1-3h6l1 3M9 11h6"></path></svg>', trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"></path></svg>', restore: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 2-5.3"></path><path d="M4 5v5h5"></path></svg>' }[name] || '');
    const statusMeta = {
      active: { label: '活跃知识', tag: 'blue' },
      review: { label: '待复查', tag: 'amber' },
      archived: { label: '已归档', tag: 'red' },
    };
    const currentItems = () => items.filter(item => item.status === state.status && (!state.search || (item.title + item.content + item.domain).toLowerCase().includes(state.search.toLowerCase())));
    const count = (status) => items.filter(item => item.status === status).length;
    const selectedItem = () => items.find(item => item.id === state.selected) || items.find(item => item.status === state.status) || items[0];
    const typeTag = (item) => `<span class="tag ${item.type === 'Solution' ? 'blue' : item.type === 'Pattern' ? 'green' : 'amber'}">${item.type}</span>`;
    const itemCard = (item) => `<button class="item ${item.id === state.selected ? 'selected' : ''}" data-select="${item.id}">
      <div class="item-top"><div class="item-title-wrap"><span class="item-title">${item.title}</span><span class="item-kind">${typeTag(item)}</span></div><span class="item-confidence-value ${item.confidence < 0.5 ? 'low' : ''}">置信度 ${Math.round(item.confidence * 100)}%</span></div>
      <span class="item-content">${item.content}</span>
      <span class="item-foot"><span class="item-domain">${item.domain}</span><span>·</span><span class="item-updated">${item.updated}</span></span>
    </button>`;
    const statusTabs = () => `<div class="status-tabs">
      ${['active', 'review', 'archived'].map(status => `<button class="status-tab ${state.status === status ? 'active' : ''}" data-status="${status}">${statusMeta[status].label}<span class="count">${count(status)}</span></button>`).join('')}
    </div>`;
    const search = () => `<label class="search-box">${icon('search')}<input class="js-search" type="search" placeholder="搜索标题、内容或域……" value="${state.search}"></label>`;
    const detailActions = (item, compact = false) => {
      if (item.status === 'archived') return `<button class="button primary" data-action="restore">${icon('restore')}恢复到活跃</button><button class="button danger" data-action="delete">${icon('trash')}永久删除</button>`;
      if (item.status === 'review') return `<button class="button primary" data-action="useful">${icon('check')}确认有用</button><button class="button warning" data-action="keep">暂不处理</button><button class="button danger" data-action="delete">${icon('trash')}删除</button>`;
      return `<button class="button" data-action="private">${compact ? '设为私有' : '标记为私有'}</button><button class="button warning" data-action="review">送入复查</button><button class="button danger" data-action="delete">${icon('trash')}删除</button>`;
    };
    const detailCore = (item, extra = '', variant = '') => {
      const current = currentItems();
      const index = Math.max(0, current.findIndex(entry => entry.id === item.id));
      const tools = variant === 'a'
        ? `<div class="detail-tools-a"><span class="detail-position">${index + 1} / ${current.length}</span><button class="icon-button" data-nav="prev" aria-label="上一条">←</button><button class="icon-button" data-nav="next" aria-label="下一条">→</button></div>`
        : '<div class="detail-actions"><button class="icon-button" data-action="private" aria-label="私有标记">◉</button></div>';
      return `<div class="detail-top ${variant === 'a' ? 'detail-top-a' : ''}"><div><div class="detail-kicker">知识详情　·　${item.domain}</div><h2>${item.title}</h2><div style="display:flex;gap:7px;margin-top:13px"><span class="tag ${statusMeta[item.status].tag}">${statusMeta[item.status].label}</span></div></div>${tools}</div>
        <div class="detail-body ${variant === 'a' ? 'detail-a' : ''}"><p>${item.content}</p><div class="callout"><strong>为什么在这里：</strong> ${item.note}</div>${extra}<div class="detail-section"><div class="section-label">来源与更新时间</div><div class="meta-grid"><div class="meta-cell"><label>来源会话</label><strong>${item.source}</strong></div><div class="meta-cell"><label>最近更新</label><strong>${item.updated}</strong></div></div></div><div class="detail-footer">${detailActions(item)}</div></div>`;
    };

    function variantA(item) {
      return `<div class="split variant-a"><aside class="left-pane"><div class="pane-head"><div class="pane-head-row"><span class="pane-title">知识条目</span></div>${search()}</div>${statusTabs()}<div class="a-confidence-note"><span class="a-confidence-info">i</span><span><strong>置信度</strong> 是知识正确且可复用程度的估计，越高越适合直接检索。</span></div><div class="list">${currentItems().map(itemCard).join('') || '<div class="empty">这个状态下还没有条目。<br>Learning Engine 的新知识会出现在活跃列表。</div>'}</div></aside><section class="right-pane"><div class="detail">${detailCore(item, '', 'a')}</div></section></div>`;
    }
    function variantB(item) {
      const checklist = item.status === 'review' ? `<div class="detail-section"><div class="section-label">复查提示</div><div class="review-checklist"><div class="check-row"><span class="check">✓</span>来源会话仍然存在</div><div class="check-row pending"><span class="check">!</span>需要人工确认当前代码是否仍适用</div><div class="check-row pending"><span class="check">!</span>确认后将重新进入活跃检索</div></div></div>` : '';
      return `<div class="split variant-b"><aside class="left-pane"><div class="pane-head"><div class="pane-head-row"><span class="pane-title">知识收件箱</span></div>${search()}</div>${statusTabs()}<div class="list">${currentItems().map(itemCard).join('') || '<div class="empty">当前队列已清空。</div>'}</div></aside><section class="right-pane"><div class="inspector-banner"><p>条目详情</p></div><div class="inspector-main">${detailCore(item, checklist)}</div></section></div>`;
    }
    function variantC(item) {
      const trace = `<div class="detail-section"><div class="section-label">知识谱系</div><div class="source-trace"><div class="trace-card"><small>提炼来源</small><strong>${item.source}</strong></div><div class="trace-card"><small>生命周期</small><strong>${item.status === 'active' ? '活跃 · 可检索' : item.status === 'review' ? '待复查 · 暂停检索' : '已归档 · 已暂停'}</strong></div></div></div>`;
      return `<div class="split variant-c"><aside class="left-pane"><div class="pane-head"><div class="eyebrow">Library index</div><div class="pane-head-row" style="margin-top:6px"><span class="pane-title">全部知识卡片</span></div>${search()}</div>${statusTabs()}<div class="list">${currentItems().map(itemCard).join('') || '<div class="empty">没有匹配的知识卡片。</div>'}</div></aside><section class="right-pane"><div class="notebook-head"><div class="detail-kicker">KNOWLEDGE NOTE · ${item.id.toUpperCase()}</div></div><div class="notebook-body"><div class="detail">${detailCore(item, trace)}</div></div></section></div>`;
    }

    function render() {
      const item = selectedItem();
      if (item) state.selected = item.id;
      document.querySelector('#prototype-root').innerHTML = state.variant === 'A' ? variantA(item) : state.variant === 'B' ? variantB(item) : variantC(item);
      document.querySelector('[data-variant-label]').textContent = `${state.variant} · ${variantNames[state.variant]}`;
      bindPage();
    }
    function bindPage() {
      document.querySelectorAll('[data-status]').forEach(button => button.addEventListener('click', () => { state.status = button.dataset.status; state.selected = items.find(item => item.status === state.status)?.id || state.selected; render(); }));
      document.querySelectorAll('[data-select]').forEach(button => button.addEventListener('click', () => { state.selected = button.dataset.select; render(); }));
      document.querySelectorAll('[data-nav]').forEach(button => button.addEventListener('click', () => navigateItem(button.dataset.nav)));
      const input = document.querySelector('.js-search');
      if (input) input.addEventListener('input', event => { state.search = event.target.value; document.querySelectorAll('[data-select]').forEach(card => { const item = items.find(entry => entry.id === card.dataset.select); card.hidden = !((item.title + item.content + item.domain).toLowerCase().includes(state.search.toLowerCase())); }); });
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => act(button.dataset.action)));
    }
    function navigateItem(direction) {
      const visible = currentItems();
      if (!visible.length) return;
      const currentIndex = Math.max(0, visible.findIndex(item => item.id === state.selected));
      const offset = direction === 'prev' ? -1 : 1;
      state.selected = visible[(currentIndex + offset + visible.length) % visible.length].id;
      render();
    }
    function act(action) {
      const item = selectedItem();
      if (!item) return;
      if (action === 'restore' || action === 'useful') { item.status = 'active'; state.status = 'active'; state.notice = '已恢复到活跃知识，重新参与检索。'; }
      else if (action === 'review') { item.status = 'review'; state.status = 'review'; state.notice = '已送入待复查队列。'; }
      else if (action === 'delete') { const index = items.findIndex(entry => entry.id === item.id); items.splice(index, 1); state.status = item.status; state.notice = '已删除知识条目。'; }
      else if (action === 'private') { state.notice = '原型中仅展示操作反馈，正式实现时写入私有标记。'; }
      else { state.notice = '保持在当前队列，稍后再处理。'; }
      render();
      const notice = document.createElement('div'); notice.className = 'notice'; notice.textContent = state.notice; document.body.appendChild(notice); setTimeout(() => notice.remove(), 2200);
    }
    function switchVariant(delta) { const index = variantKeys.indexOf(state.variant); state.variant = variantKeys[(index + delta + variantKeys.length) % variantKeys.length]; const params = new URLSearchParams(location.search); params.set('variant', state.variant); history.replaceState({}, '', `${location.pathname}?${params}`); render(); }
    document.querySelector('[data-switch="prev"]').addEventListener('click', () => switchVariant(-1));
    document.querySelector('[data-switch="next"]').addEventListener('click', () => switchVariant(1));
    document.querySelector('[data-theme-toggle]').addEventListener('click', () => { document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark'; });
    document.addEventListener('keydown', event => { if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return; if (event.key === 'ArrowLeft') switchVariant(-1); if (event.key === 'ArrowRight') switchVariant(1); });
    render();
  </script>
</body>
</html>
