name: release

# Versioned releases: pushing a v* tag (e.g. v0.0.1) builds the multi-arch
# Docker image and, only once that build succeeds, pushes it to GHCR under
# BOTH `latest` and the tag name (v0.0.1), then creates a GitHub Release.
# Release notes come from RELEASE_NOTES.md at the tag's commit (update it
# before tagging). Kept separate from the build workflow on purpose — no tests
# here; the image is the gate.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  packages: write # GHCR image push

jobs:
  docker:
    name: Docker image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # push: true only pushes after a successful build — the gate.
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          # buildx defaults to provenance: true, which appends an attestation
          # manifest per architecture that GHCR lists as an "unknown/unknown"
          # platform. This repo has no need for SLSA provenance — disable it so
          # the image index only contains the two real architectures.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker] # only after the image build+push succeeded
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        # Curated release notes (written before tagging) instead of an
        # auto-generated commit list. The checkout is the tagged commit, so
        # RELEASE_NOTES.md is the version being released.
        run: gh release create "${{ github.ref_name }}" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
