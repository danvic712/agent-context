name: release

# Versioned releases: pushing a v* tag (e.g. v0.0.1) builds the multi-arch
# Docker image and, only once that build succeeds, pushes it to GHCR under
# BOTH `latest` and the tag name (v0.0.1), then creates a GitHub Release.
# Kept separate from the build workflow on purpose — no tests here; the image
# is the gate.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # GitHub Release
  packages: write # GHCR image push

jobs:
  docker:
    name: Docker image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # push: true only pushes after a successful build — the gate.
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker] # only after the image build+push succeeded
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        run: gh release create "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
