name: build

# Every push to main (and pull requests) runs the build + full test suite.
# Docker images are NOT built here — versioned image tags (latest + the tag)
# are produced by the separate release workflow, which triggers on v* tags.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (linux · Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # The web UI must exist: WebHostSmokeTests serves the React app from
      # wwwroot. Build it first, then let the Host build copy it into the output
      # (SkipSpaBuild avoids re-running Vite inside the dotnet build).
      # Testcontainers needs Docker, preinstalled on this runner.
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build
        run: dotnet build AgentContext.slnx -c Release -p:SkipSpaBuild=true
      - name: Test
        run: |
          mapfile -t test_projects < <(find tests -type f -name '*.csproj' | sort)
          if ((${#test_projects[@]} == 0)); then
            echo "No test projects found under tests/"
            exit 1
          fi

          run_tests() {
            local failed=0
            for project in "${test_projects[@]}"; do
              echo "Testing ${project}"
              if ! dotnet test "${project}" -c Release --no-build; then
                failed=1
              fi
            done
            return "${failed}"
          }

          # Testcontainers flakiness (a pgvector container occasionally dies mid-run,
          # surfacing as a transient Npgsql connection reset) is not a product
          # failure — retry once before failing the build.
          if ! run_tests; then
            run_tests
          fi
