name: build

# Builds on GitHub: full test suite (Postgres via Testcontainers), the multi-arch
# Docker image (linux/amd64 + linux/arm64, pushed to GHCR on main), and a
# macOS Apple-Silicon binary (osx-arm64 publish artifact). Run locally with
# `docker compose build` — the machine must reach nuget.org for the Aspire
# AppHost dependency tree (DCP + dashboard RID packages).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (linux · Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # SkipSpaBuild keeps the test build web-free (the suite drives the REST/MCP
      # seams, not the UI); Testcontainers needs Docker, preinstalled on this runner.
      - name: Build
        run: dotnet build tests/AgentContext.Tests/AgentContext.Tests.csproj -c Release -p:SkipSpaBuild=true
      - name: Test
        run: dotnet test tests/AgentContext.Tests/AgentContext.Tests.csproj -c Release --no-build

  docker:
    name: Docker image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          # gha cache keeps the NuGet/npm downloads out of every build's critical path.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  macos:
    name: macOS binary (Apple Silicon)
    runs-on: macos-14 # arm64 runner
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Publish osx-arm64
        run: dotnet publish src/AgentContext.Host/AgentContext.Host.csproj -c Release -r osx-arm64 --self-contained false -o artifacts/osx-arm64 -p:SkipSpaBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: agent-context-osx-arm64
          path: artifacts/
          if-no-files-found: error
