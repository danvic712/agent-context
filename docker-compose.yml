services:
  Database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent_context
      POSTGRES_PASSWORD: agent_context
      POSTGRES_DB: agent_context
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_context -d agent_context"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  Host:
    image: danvic712/agent-context
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: Host=Database;Port=5432;Database=agent_context;Username=agent_context;Password=agent_context
      # Learning Engine LLM endpoint (ADR 0003) is stored in the settings table
      # (settings REST/UI is a later ticket) — no env surface for it in v1.
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      Database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
