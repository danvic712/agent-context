services:
  Database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent_context
      POSTGRES_PASSWORD: agent_context
      POSTGRES_DB: agent_context
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_context -d agent_context"]
      interval: 5s
      timeout: 5s
      retries: 10

  Host:
    image: danvic712/agent-context
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: Host=Database;Port=5432;Database=agent_context;Username=agent_context;Password=agent_context
      # Learning Engine LLM endpoint (ADR 0003): one OpenAI-compatible base URL + key
      # serves extraction and embedding in v1. Override via the host environment, e.g.
      #   LLM_BASE_URL=http://host.docker.internal:11434/v1 LLM_API_KEY=... docker compose up
      # Default EmbeddingModel is text-embedding-3-small (vector(1536)); if the endpoint
      # serves another dimension the vector(1536) column needs a new migration.
      Llm__BaseUrl: ${LLM_BASE_URL:-}
      Llm__ApiKey: ${LLM_API_KEY:-}
      Llm__Model: ${LLM_MODEL:-gpt-4o-mini}
      Llm__EmbeddingModel: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "8080:8080"
    depends_on:
      Database:
        condition: service_healthy

volumes:
  pgdata:
