services:
  postgres:
    # Fixed container name (no compose -1 suffix): on OrbStack also reachable at
    # agent-context-postgres.orb.local:5432.
    container_name: agent-context-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent_context
      POSTGRES_PASSWORD: agent_context
      POSTGRES_DB: agent_context
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_context -d agent_context"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  portal:
    # Fixed container name (no compose -1 suffix): on OrbStack the UI is also
    # reachable at agent-context.orb.local (stable alias).
    container_name: agent-context
    image: danvic712/agent-context
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=agent_context;Username=agent_context;Password=agent_context
      # Learning Engine LLM endpoint (ADR 0003) is stored in the settings table
      # (settings REST/UI is a later ticket) — no env surface for it in v1.
      # Skill packages (T12) live on the filesystem under Skills:Directory.
      Skills__Directory: /data/skills
      # Listen on 80 (HTTP default) so OrbStack domains need no port.
      # OrbStack proxies HTTPS automatically for .orb.local domains, so both of
      # these work: http://portal.agent-context.orb.local and
      # https://portal.agent-context.orb.local
      ASPNETCORE_URLS: http://+:80
    ports:
      - "8080:80"
    volumes:
      - skills-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  skills-data:
