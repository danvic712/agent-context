services:
  postgres:
    # Fixed container name (no compose -1 suffix): on OrbStack also reachable at
    # agent-context-postgres.orb.local:5432.
    container_name: agent-context-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent_context
      POSTGRES_PASSWORD: agent_context
      POSTGRES_DB: agent_context
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_context -d agent_context"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  portal:
    # Fixed container name (no compose -1 suffix): on OrbStack the UI is also
    # reachable at agent-context.orb.local (stable alias).
    container_name: agent-context
    # Published by the release workflow (v* tags) as multi-arch linux/amd64 +
    # linux/arm64; Docker picks the matching platform automatically. The local
    # `build:` block is still available for `docker compose build`.
    image: ghcr.io/danvic712/agent-context:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=agent_context;Username=agent_context;Password=agent_context
      # Learning Engine LLM endpoint (ADR 0003) is stored in the settings table
      # (settings REST/UI is a later ticket) — no env surface for it in v1.
      # Skill packages (T12) live on the filesystem under Skills:Directory.
      Skills__Directory: /data/skills
      # T13: OTLP export destination. In-network address of the aspire-dashboard
      # service — the image listens on 18889 for OTLP/gRPC (host port 4317 is just
      # a mapping); standalone runs default to http://localhost:4317 in code.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      # Browser-facing dashboard URL for the UI's "open dashboard" menu entry.
      DASHBOARD_URL: http://localhost:18888
      # Listen on 80 (HTTP default) so OrbStack domains need no port.
      # OrbStack proxies HTTPS automatically for .orb.local domains, so both of
      # these work: http://portal.agent-context.orb.local and
      # https://portal.agent-context.orb.local
      ASPNETCORE_URLS: http://+:80
    ports:
      - "8080:80"
    volumes:
      - skills-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    restart: unless-stopped

  aspire-dashboard:
    # Global observability (T13): the default destination for the portal's OTLP
    # export — a feature, not an opt-in. UI on 18888; OTLP ingest exposed on the
    # standard host ports 4317 (gRPC) / 4318 (HTTP), mapped from the image's
    # internal 18889/18890. Telemetry is in-memory (dev/diagnostics tool).
    container_name: agent-context-dashboard
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      # Local development only: no login token / API key to view telemetry.
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888" # dashboard UI
      - "4317:18889"  # OTLP/gRPC
      - "4318:18890"  # OTLP/HTTP
    restart: unless-stopped

volumes:
  pgdata:
  skills-data:
