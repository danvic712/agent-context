services:
  postgres:
    # External dependency (issue #15): the image deliberately does NOT bundle
    # postgres. Fixed container name (no compose -1 suffix): on OrbStack also
    # reachable at agent-context-postgres.orb.local:5432.
    container_name: agent-context-postgres
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agent_context
      POSTGRES_PASSWORD: agent_context
      POSTGRES_DB: agent_context
      # Single shared data volume (T15 follow-up): postgres stores its data in a
      # subdirectory of the /data mountpoint — the official image's recommended
      # layout when the mount is a volume. Everything lives under the program
      # name, so one directory holds the whole app's data.
      PGDATA: /data/agent-context/postgres
    ports:
      # Loopback only: the app reaches postgres over the compose network; no
      # need to expose it to the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_context -d agent_context"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  agent-context:
    # T15 (issue #15): the image is COMPLETE — one container runs the full
    # AppHost orchestration: the portal child process (React UI + REST + MCP
    # /mcp) on :8080 and the in-process Aspire dashboard on :18888 (fixed port,
    # with the AppHost-only Resources view). Postgres stays an external service
    # above, wired via ConnectionStrings__Default; the dashboard no longer ships
    # as a compose sibling (it lives inside the image).
    # Fixed container name (no compose -1 suffix): on OrbStack the UI is also
    # reachable at agent-context.orb.local (stable alias).
    container_name: agent-context
    image: ghcr.io/danvic712/agent-context:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=agent_context;Username=agent_context;Password=agent_context
      # Skill packages (T12) live on the filesystem. Single shared data volume:
      # everything under /data/agent-context (program name) — postgres owns the
      # db subdirectory, this service owns skills. The AppHost passes the value
      # straight to the portal child (T15 follow-up).
      Skills__Directory: /data/agent-context/skills
      # Browser-facing dashboard URL for the UI's "open dashboard" menu entry.
      # Keep navigation on the portal's same-origin proxy so the dashboard uses
      # the single-port /monitor surface instead of bypassing the portal.
      DASHBOARD_URL: http://localhost:8080/monitor/resources
      # OTLP export is injected by the AppHost's WithOtlpExporter() — the portal
      # child process gets OTEL_EXPORTER_OTLP_ENDPOINT pointing at the in-process
      # dashboard automatically (T13). No env surface needed here.
    ports:
      - "8080:8080"   # portal + same-origin dashboard proxy at /monitor
      # Aspire dashboard listens on 18888 inside the container; it is intentionally
      # not exposed separately so all browser navigation stays under the portal.
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The aspnet image ships no curl/wget (noble-slim base), so probe with
      # bash /dev/tcp. GET /api/health returns HTTP 200 only when the portal is
      # up AND the database is reachable (HealthController). The AppHost needs
      # time to start DCP + the dashboard + the portal child first.
      test:
        - CMD-SHELL
        - 'bash -c ''exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /api/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "200 OK" <&3'''
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  # Single data volume for the whole app: db (PGDATA=/data/agent-context/postgres)
  # and skills (/data/agent-context/skills) share one mount, so backup, cleanup
  # and inspection touch exactly one volume / one directory.
  data:
